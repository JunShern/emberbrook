<!doctype html>
<meta charset="utf-8">
<!-- Everything below loads with the SHIPPED relative paths ("js/…", "game/…",
     "assets/…"), exactly as play3d.html does. The base tag re-roots them at
     public/ so this file can live in tools/ without any module knowing. Serve
     the REPO ROOT and open /tools/ui_mock.html. -->
<base href="/public/">
<title>Emberbrook — UI mock</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- ============================================================================
  ui_mock.html — a still-life of the game's overlays for art review.

  WHY IT EXISTS: the battle screen and the pause menu are the two surfaces the
  user judges by eye, and both normally require walking the 3D world into an
  encounter. This page boots the REAL modules (game_state, battle_rules,
  battle_turnbased, ui_kit, shop, menu) against the REAL rules data, stubs only
  the two things play3d owns (UILOCK, SIM), poses a fixture party, and parks the
  UI in one chosen state so it can be screenshotted.

  It is a HARNESS, not a fixture of its own: nothing here re-implements a panel.
  If a screen looks wrong here it looks wrong in the game.

    ?view=battle   the battle screen, waiting on Vesper's command
       &state=cmd|target|items|outro
    ?view=menu     the pause menu
       &screen=root|party|equip|items
    ?view=shop&shop=del-weapon

  THE SCENE UNDER THE MENU IS REAL ART, AND THAT IS THE POINT. The pause menu
  and the shop are OVERLAYS: the engine keeps rendering the frozen world beneath
  them (that is what UILOCK buys), so judging translucent blue windows over a
  flat wash judges the wrong thing entirely. `bg` parks an actual scene plate
  behind the windows — by default a shipped del-cine background, i.e. what the
  player is looking at the moment they press Esc.
    &bg=<path>   any image under the served repo root
    &bg=none     the old abstract wash
============================================================================= -->
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#05050c;
               font-family:system-ui,-apple-system,"Segoe UI",sans-serif }
  /* The 3D world under the pause menu and the shop. #s.art carries a real
     pre-rendered scene; without it, a deliberately non-art wash so nobody
     mistakes the fallback for a backdrop plate. */
  #s { position:fixed; inset:0; overflow:hidden;
       background:
         radial-gradient(42% 30% at 66% 22%, #ffd7973d 0%, #0000 64%),
         radial-gradient(70% 50% at 20% 88%, #2a1b0f66 0%, #0000 70%),
         linear-gradient(180deg,#2b3a4a 0%,#3d4a38 34%,#4a4530 50%,#2c2618 68%,#14100a 100%) }
  #s::after { content:''; position:absolute; inset:0;
              background:repeating-linear-gradient(122deg,#0000 0 34px,#00000012 34px 68px) }
  #s.art { background-size:cover; background-position:center }
  #s.art::after { display:none }
  #mockbar { position:fixed; left:8px; bottom:6px; z-index:99;
             font:10px ui-monospace,Menlo,monospace; color:#7b83a8; letter-spacing:.1em;
             pointer-events:none }
</style>

<script>
  // ---- the two things play3d owns, stubbed --------------------------------
  // UILOCK is copied from play3d's own implementation (the modal-input contract);
  // SIM answers the handful of probes the modules make and nothing more.
  window.UILOCK = (function () {
    const held = Object.create(null);
    return {
      lock(k) { held[k] = 1; }, unlock(k) { delete held[k]; },
      active() { for (const k in held) return true; return false; },
    };
  })();
  window.SIM = {
    keys() { }, pos() { return { x: 0, y: 0, z: 0 }; },
    graph() { return null; }, pad() { return null; },
  };
</script>

<script src="js/game_state.js"></script>
<script src="js/battle_rules.js"></script>
<script src="js/battle_turnbased.js"></script>
<script src="js/ui_kit.js"></script>
<script src="js/shop.js"></script>
<script src="js/menu.js"></script>

<div id="s"></div>
<div id="mockbar"></div>

<script>
(function () {
  'use strict';
  const P = new URLSearchParams(location.search);
  const view = P.get('view') || 'battle';
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // the modules listen in the CAPTURE phase on window, so a synthetic event
  // drives them through exactly the path a real keypress takes
  const key = k => window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
  const note = t => { document.getElementById('mockbar').textContent = t; };

  // ---- the frozen world behind the overlays --------------------------------
  // A REAL scene plate, decoded before anything is screenshotted so the menu is
  // never photographed over a blank. Absolute paths, because <base> re-roots
  // relative ones at public/ and these renders live in docs/.
  const SCENE = '/public/assets/scenes/del-cine/cameras/quay-west/bg.png';
  function scene() {
    const bg = P.get('bg');
    if (bg === 'none') return Promise.resolve();
    const url = bg || SCENE;
    return new Promise((done) => {
      const im = new Image();
      im.onload = () => {
        const s = document.getElementById('s');
        s.classList.add('art');
        s.style.backgroundImage = 'url("' + url + '")';
        done();
      };
      im.onerror = () => { console.warn('[mock] no scene plate at', url); done(); };
      im.src = url;
    });
  }

  // ---- the fixture party ---------------------------------------------------
  // Mid-journey, deliberately NOT at full HP: gauges that read 100% tell you
  // nothing about how a gauge looks.
  function poseState() {
    const GS = window.GS;
    GS.state.gold = 214;
    GS.state.inventory = { tonic: 3, 'hale-tonic': 1, 'river-cudgel': 1, 'oilskin-coat': 1, 'reed-tuft': 4 };
    const v = GS.state.party.find(p => p.id === 'vesper');
    if (v) { v.level = 4; v.xp = 178; v.hp = 33; }
    const m = GS.state.party.find(p => p.id === 'maren');
    if (m) {
      m.active = true; m.level = 3; m.xp = 96; m.hp = 14;
      m.equip = { weapon: 'boat-hook', armor: null };
    }
    GS.emit && GS.emit('change', GS.state);
  }

  // ---- battle --------------------------------------------------------------
  async function battle() {
    const state = P.get('state') || 'cmd';
    const zone = P.get('zone') || 'forest';
    const group = (P.get('group') || 'duskpad,bramble-shade,duskpad').split(',');
    // fade:0 — a screenshot has no use for a 350 ms black veil. The promise is
    // DELIBERATELY not awaited: a battle waiting on a command never resolves,
    // and the whole point of this page is to park it there.
    window.Battle.start({ zone: zone, group: group, seed: 20260730, backdrop: zone },
      null, { fade: () => Promise.resolve() }).catch(e => console.error(e));

    await wait(650);                       // let the screen mount and the art decode
    if (state === 'target') key('Enter');  // Attack -> target step
    if (state === 'items') { key('ArrowDown'); key('Enter'); }
    if (state === 'outro') {
      // walk a real fight to its end rather than faking a summary box
      for (let i = 0; i < 60 && window.Battle.active; i++) { key('Enter'); await wait(90); }
    }
    // the party sprites are chroma-keyed from 1.4 MB plates on a canvas, so they
    // mount a beat after the screen does — a still must not be taken before then
    for (let i = 0; i < 60 && !document.querySelector('.ebb-hero:not(.pending)'); i++) await wait(50);
    await wait(400);

    // A damage number lives for 950 ms. For a STILL we plant one and freeze it
    // mid-pop, because the pop is one of the things being reviewed.
    const plant = (host, text, cls, css) => {
      if (!host) return;
      const n = document.createElement('div');
      n.className = 'ebb-num' + (cls ? ' ' + cls : '');
      n.textContent = text;
      n.style.cssText = 'animation:none;opacity:1;transform:translate(-50%,-14px) scale(1);' + (css || '');
      host.appendChild(n);
    };
    if (state === 'cmd' || state === 'target') {
      plant(document.querySelectorAll('.ebb-foe')[1], '17');
      // and one heal on the hero standing on the field, so both colours are
      // visible at once and the number is seen where it will actually appear
      plant(document.querySelector('.ebb-hero:not(.pending)'), '+22', 'heal');
    }
    note('mock · battle · ' + zone + ' · ' + state);
  }

  // ---- pause menu ----------------------------------------------------------
  async function menu() {
    const screen = P.get('screen') || 'party';
    window.Menu.open();
    await wait(120);
    if (screen === 'party') { key('Enter'); }
    if (screen === 'equip') { key('ArrowDown'); key('Enter'); key('Enter'); key('Enter'); }
    if (screen === 'items') { key('ArrowDown'); key('ArrowDown'); key('Enter'); }
    note('mock · menu · ' + screen);
  }

  // ---- shop ----------------------------------------------------------------
  async function shop() {
    const id = P.get('shop') || 'del-weapon';
    window.Shop.openShop(id);
    await wait(120);
    if (P.get('qty')) { key('ArrowDown'); key('Enter'); key('ArrowRight'); key('ArrowRight'); }
    note('mock · shop · ' + id);
  }

  (async function boot() {
    try {
      await window.GS.ready;
      if (!window.GS.ok) { note('mock · GS FAILED TO LOAD DATA — serve the repo root'); return; }
      poseState();
      // the battle is full-bleed over its own plate; only the overlays need one
      if (view !== 'battle') await scene();
      if (view === 'battle') await battle();
      else if (view === 'shop') await shop();
      else await menu();
      await wait(260);                 // let keyed sprites and plates settle
      document.documentElement.setAttribute('data-mock-ready', '1');
    } catch (e) {
      note('mock · ERROR ' + e);
      console.error(e);
    }
  })();
})();
</script>
