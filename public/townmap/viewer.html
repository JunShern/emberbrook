        const mat = new THREE.MeshBasicMaterial({
          color: st.stroke, transparent: true, opacity: faint ? 0.34 : 0.92,
        });
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, divisions, TUBE_R[e.type], 6, false), mat);
        tube.userData.edge = e;
        root.add(tube);
        parts.push({ mat, baseOpacity: mat.opacity });
      }
      if (dash || TUBE_R[e.type] === undefined){
        const geo = new THREE.BufferGeometry().setFromPoints(sampled);
        let line, baseOpacity;
        if (dash){
          baseOpacity = 0.95;
          line = new THREE.Line(geo, new THREE.LineDashedMaterial({
            color: st.stroke, dashSize: dash[0], gapSize: dash[1],
            transparent: true, opacity: baseOpacity,
          }));
          line.computeLineDistances();             // required for dashes
        } else {
          baseOpacity = 0.9;
          line = new THREE.Line(geo, new THREE.LineBasicMaterial({
            color: st.stroke, transparent: true, opacity: baseOpacity,
          }));
        }
        line.userData.edge = e;
        root.add(line);
        parts.push({ mat: line.material, baseOpacity });
      }
      edgeObjs.push({ edge: e, parts });
    }

    // --- parcels: wireframe box + a faint pickable shell -----------------
    for (const p of parcels){
      const mn = p.bounds.min, mx = p.bounds.max;
      const sx = Math.max(mx[0] - mn[0], 0.01);
      const sy = Math.max(mx[2] - mn[2], 0.01);      // town z -> three y
      const sz = Math.max(mx[1] - mn[1], 0.01);      // town y -> three z
      const c = new THREE.Vector3((mn[0] + mx[0]) / 2, (mn[2] + mx[2]) / 2,
                                  -(mn[1] + mx[1]) / 2);
      const box = new THREE.BoxGeometry(sx, sy, sz);
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(box),
        new THREE.LineBasicMaterial({ color:0x7f8ea3, transparent:true, opacity:0.5 }));
      edges.position.copy(c);
      const shell = new THREE.Mesh(box, new THREE.MeshBasicMaterial({
        color:0x7f8ea3, transparent:true, opacity:0.045,
        depthWrite:false, side:THREE.DoubleSide,
      }));
      shell.position.copy(c);
      shell.userData.parcel = p;
      root.add(edges); root.add(shell);
      parcelPicks.push(shell);
      parcelObjs.set(p.id, { edges, shell });
    }

    // --- parcel scene cameras: gizmo + ortho frustum ---------------------
    camGroup = new THREE.Group();
    root.add(camGroup);
    for (const p of parcels) buildCamera(p);

    frameTown(ex);
    applySelection();
    applyLabels();
    applyFrustums();
    buildCamStrip(map);
    resize();
  }

  /**
   * The view volume of a spec, as wireframe line segments in camera-local
   * space (looking down local -Z). Ortho is a rectangular prism; perspective
   * is a true frustum pyramid — near rect, far rect, and the four rays that
   * would meet at the eye.
   */
  function frustumGeometry(spec){
    if (spec.projection !== "persp"){
      const depth = Math.max(spec.far - spec.near, 0.1);
      const geo = new THREE.EdgesGeometry(
        new THREE.BoxGeometry(spec.width, spec.height, depth));
      // BoxGeometry is centred; shift it down the view axis
      geo.translate(0, 0, -(spec.near + depth / 2));
      return geo;
    }
    const tanV = Math.tan(spec.fov * Math.PI / 360);
    const tanH = tanV * spec.aspect;
    const rect = z => [                       // z is a positive depth
      [-tanH * z,  tanV * z, -z], [ tanH * z,  tanV * z, -z],
      [ tanH * z, -tanV * z, -z], [-tanH * z, -tanV * z, -z],
    ];
    // draw the near plane where the camera actually clips, and the far plane
    // just past the parcel, so the pyramid reads as the real view volume
    const n = rect(Math.max(spec.near, spec.dist * 0.02));
    const f = rect(spec.far);
    const pts = [];
    const seg = (a, b) => { pts.push(...a, ...b); };
    for (let i = 0; i < 4; i++){
      seg(n[i], n[(i + 1) % 4]);              // near rect
      seg(f[i], f[(i + 1) % 4]);              // far rect
      seg([0, 0, 0], f[i]);                   // eye -> far corner (through near)
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    return geo;
  }

  /**
   * One parcel camera: a gizmo at the computed position plus its view volume.
   * `projOverride` (the POV panel's live toggle) decides which projection is
   * drawn, so the gizmo always matches the shot in the panel.
   */
  function buildCamera(parcel){
    const spec = deriveParcelCamera(parcel, projOverride);

    // town-space basis -> three-space basis. Camera convention: local -Z is
    // forward, so the third basis column is -forward.
    const right = t3v(spec.right).normalize();
    const up    = t3v(spec.up).normalize();
    const fwd   = t3v(spec.forward).normalize();
    const holder = new THREE.Object3D();
    holder.matrixAutoUpdate = false;
    holder.matrix.makeBasis(right, up, fwd.clone().negate());
    holder.matrix.setPosition(t3(spec.pos));
    holder.matrixWorld.copy(holder.matrix);

    // --- gizmo: body + lens cone, drawn along local -Z -------------------
    const gizMat = new THREE.MeshLambertMaterial({ color: 0x9ad0ff });
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(GIZMO * 0.95, GIZMO * 0.7, GIZMO * 1.05), gizMat);
    const lens = new THREE.Mesh(
      new THREE.ConeGeometry(GIZMO * 0.42, GIZMO * 0.8, 12), gizMat);
    lens.rotation.x = -Math.PI / 2;                 // cone +Y -> local -Z
    lens.position.set(0, 0, -GIZMO * 0.85);
    body.userData.parcelId = parcel.id;
    lens.userData.parcelId = parcel.id;
    holder.add(body); holder.add(lens);
    camPicks.push(body, lens);

    // --- view volume: box prism for ortho, pyramid for perspective -------
    const frustum = new THREE.LineSegments(
      frustumGeometry(spec),
      new THREE.LineBasicMaterial({ color:0x6fd3ff, transparent:true, opacity:0.28 }));
    holder.add(frustum);

    camGroup.add(holder);

    const lab = makeLabel("cam:" + parcel.id, "#9ad0ff", 26);
    const lp = t3(spec.pos);
    lab.position.set(lp.x, lp.y + GIZMO * 1.4, lp.z);
    lab.userData.isCamLabel = true;
    camGroup.add(lab);
    labels.push(lab);

    camObjs.set(parcel.id, { spec, holder, frustum, gizMat, label: lab });
  }

  /**
   * Rebuild every camera gizmo. Needed on a projection flip: the two variants
   * differ in stand-off distance as well as volume shape, so the whole rig
   * moves, not just its wireframe.
   */
  function rebuildCameras(){
    if (!root || !camGroup || !state.map) return;
    root.remove(camGroup);
    disposeTree(camGroup);
    labels = labels.filter(sp => !sp.userData.isCamLabel);
    camPicks = []; camObjs = new Map();
    camGroup = new THREE.Group();
    root.add(camGroup);
    for (const p of (state.map.parcels || [])) buildCamera(p);
    applySelection();
    applyFrustums();
  }

  /** Initial camera: close to the 2D elevation view, then free to orbit. */
  function frameTown(ex){
    target.set((ex.x[0] + ex.x[1]) / 2, (ex.z[0] + ex.z[1]) / 2, -(ex.y[0] + ex.y[1]) / 2);
    const span = Math.max(ex.x[1] - ex.x[0], ex.z[1] - ex.z[0], ex.y[1] - ex.y[0], 10);
    orbit.radius = (span / (2 * Math.tan(camera.fov * Math.PI / 360))) * 1.5;
    orbit.theta = 0.24;      // slight yaw off dead-on, for depth
    orbit.phi = 1.29;        // just above the horizon: elevation-like
    updateCamera();
  }

  function updateCamera(){
    const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
    camera.position.set(
      target.x + orbit.radius * sp * Math.sin(orbit.theta),
      target.y + orbit.radius * cp,
      target.z + orbit.radius * sp * Math.cos(orbit.theta));
    camera.lookAt(target);
  }

  // ------------------------------------------------------------- controls
  function bindControls(){
    const el = renderer.domElement;
    let dragging = null, lx = 0, ly = 0, moved = 0;

    el.addEventListener("contextmenu", e => e.preventDefault());

    el.addEventListener("pointerdown", e => {
      dragging = (e.button === 2 || e.shiftKey) ? "pan" : "orbit";
      lx = e.clientX; ly = e.clientY; moved = 0;
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointermove", e => {
      const r = el.getBoundingClientRect();
      pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      if (!dragging){ hover(); return; }
      const dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (dragging === "orbit"){
        orbit.theta -= dx * 0.006;
        orbit.phi = Math.max(0.05, Math.min(Math.PI - 0.05, orbit.phi - dy * 0.006));
      } else {
        // pan in the camera plane, scaled so the drag tracks the cursor
        const k = 2 * orbit.radius * Math.tan(camera.fov * Math.PI / 360) / r.height;
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
        target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
      }
      updateCamera();
    });

    const endDrag = e => {
      if (dragging && moved < 5) pick();          // a click, not a drag
      dragging = null;
      if (el.hasPointerCapture && el.hasPointerCapture(e.pointerId))
        el.releasePointerCapture(e.pointerId);
    };
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", () => { dragging = null; });

    el.addEventListener("wheel", e => {
      e.preventDefault();
      orbit.radius = Math.max(4, Math.min(1200, orbit.radius * Math.exp(e.deltaY * 0.0012)));
      updateCamera();
    }, { passive:false });
  }

  // -------------------------------------------------------------- picking
  function hover(){
    if (!root) return;
    ray.setFromCamera(pointer, camera);
    const camHit = ray.intersectObjects(camPicks, false)[0];
    const pinHit = camHit ? null : ray.intersectObjects(pinPicks, false)[0];
    const id = pinHit ? pinHit.object.userData.lm.id : null;
    renderer.domElement.style.cursor = (camHit || pinHit) ? "pointer" : "default";
    if (id !== hoveredId){ hoveredId = id; applyLabels(); }
  }

  function pick(){
    if (!root) return;
    ray.setFromCamera(pointer, camera);

    // cameras first: small gizmos floating outside the parcel shells
    const camHit = ray.intersectObjects(camPicks, false)[0];
    if (camHit){
      hideCard(); selectedLmId = null;
      openPov(camHit.object.userData.parcelId);
      return;
    }
    // then pins: they sit inside the parcel shells
    const pin = ray.intersectObjects(pinPicks, false)[0];
    if (pin){
      selectedLmId = pin.object.userData.lm.id;
      showCard(pin.object.userData.lm);
      applySelection(); applyLabels();
      return;
    }
    const par = ray.intersectObjects(parcelPicks, false)[0];
    if (par){
      hideCard();
      selectedLmId = null;
      selectParcel(par.object.userData.parcel.id);   // shared selection state
      return;
    }
    hideCard();
    selectedLmId = null;
    applySelection(); applyLabels();
  }

  // ------------------------------------------------------------- info card
  function showCard(lm){
    const el = document.getElementById("lmCard");
    const col = districtColor(state.map, lm.district);
    el.style.borderLeftColor = col;
    el.innerHTML = `<button class="close" title="close">&times;</button>
      <h4>${esc(lm.name || lm.id)}</h4>
      <dl>
        <dt>id</dt><dd><code>${esc(lm.id)}</code></dd>
        <dt>kind</dt><dd>${esc(lm.kind || "-")}</dd>
        <dt>district</dt><dd><i class="swatch" style="background:${col}"></i>${esc(lm.district || "-")}</dd>
        <dt>pos</dt><dd>${esc(posStr(lm.pos))}</dd>
        <dt>on map</dt><dd>${lm.mapVisible === false
          ? '<span class="sev-warn">no (hidden)</span>' : "yes"}</dd>
        ${(lm.residents||[]).length
          ? `<dt>residents</dt><dd>${esc((lm.residents||[]).join(", "))}</dd>` : ""}
      </dl>
      ${lm.note ? `<div class="note">${esc(lm.note)}</div>` : ""}`;
    el.hidden = false;
    const box = document.getElementById("view3d").getBoundingClientRect();
    const px = (pointer.x + 1) / 2 * box.width;
    const py = (1 - pointer.y) / 2 * box.height;
    el.style.left = Math.max(8, Math.min(box.width - 300, px + 14)) + "px";
    el.style.top  = Math.max(8, Math.min(Math.max(8, box.height - 170), py + 12)) + "px";
  }
  function hideCard(){ document.getElementById("lmCard").hidden = true; }

  // ------------------------------------------------------------ POV panel
  /**
   * The POV panel's own renderer. A second WebGL context over the same Scene
   * is cheaper to reason about than scissoring the main canvas now that the
   * panel sits in the sidebar rather than on top of the viewport, and it can
   * never be clipped or half-composited by the panel's own chrome.
   */
  function povInit(){
    startLoop();                 // the POV renders even while a 2D tab is up
    if (povRenderer) return povRenderer;
    povRenderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
    povRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    povRenderer.setSize(1, 1, false);
    const body = document.getElementById("povBody");
    body.appendChild(povRenderer.domElement);
    new ResizeObserver(povResize).observe(body);
    return povRenderer;
  }

  function povResize(){
    if (!povRenderer) return;
    const r = document.getElementById("povBody").getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    povRenderer.setSize(w, h, false);
  }

  /** Build the THREE camera for a spec, in whichever projection it carries. */
  function makePovCamera(s){
    let cam;
    if (s.projection === "persp"){
      cam = new THREE.PerspectiveCamera(s.fov, s.aspect, s.near, s.far);
    } else {
      cam = new THREE.OrthographicCamera(
        -s.width / 2, s.width / 2, s.height / 2, -s.height / 2, s.near, s.far);
    }
    const right = t3v(s.right).normalize();
    const up    = t3v(s.up).normalize();
    const fwd   = t3v(s.forward).normalize();
    cam.matrixAutoUpdate = false;
    cam.matrix.makeBasis(right, up, fwd.clone().negate());
    cam.matrix.setPosition(t3(s.pos));
    cam.matrixWorld.copy(cam.matrix);
    cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
    return cam;
  }

  function openPov(parcelId){
    const entry = camObjs.get(parcelId);
    if (!entry) return;
    povParcelId = parcelId;
    povDismissedFor = null;
    const s = entry.spec;

    povInit();
    povCam = makePovCamera(s);

    document.getElementById("povPanel").hidden = false;
    const parcel = (state.map.parcels || []).find(p => p.id === parcelId) || {};
    const isP = s.projection === "persp";
    const lens = isP
      ? `fov ${num(s.fov)}&deg; v / ${num(s.variants.persp.hfov)}&deg; h
         &middot; eye ${num(s.dist)}u out`
      : `ortho ${num(s.variants.ortho.width)}u`;
    document.getElementById("povHead").innerHTML =
      `<b>${esc(parcel.name || parcelId)}</b>
       <span class="dimmer">${esc(parcel.sceneKey || "")}</span>
       <span class="seg" id="povProj">
         <button data-proj="ortho" class="${isP ? "" : "on"}">ortho</button>
         <button data-proj="persp" class="${isP ? "on" : ""}">persp</button>
       </span>
       <span class="povmeta">yaw ${num(s.yaw)}&deg; &middot; pitch ${num(s.pitch)}&deg;
         &middot; margin ${num(s.margin * 100)}% &middot; ${lens}
         &middot; 1344:768</span>
       <span class="pill ${s.authored ? "sev-warn" : "sev-info"}">${s.authored ? "authored" : "default"}</span>
       ${projOverride && projOverride !== s.authoredProjection
          ? `<span class="pill sev-warn">viewer override</span>` : ""}
       <button class="close" id="povClose" title="close">&times;</button>`;

    // shared selection, force-select (no-op when it is already the selection,
    // which also keeps openPov <- syncPov <- render from recursing)
    if (selectedParcelId !== parcelId) selectParcel(parcelId, true);
    else applySelection();
    povResize();
  }

  function closePov(byUser){
    if (byUser) povDismissedFor = povParcelId;
    povParcelId = null; povCam = null;
    document.getElementById("povPanel").hidden = true;
    applySelection();
  }

  /**
   * The POV is the selected parcel's shot, so the panel simply follows the
   * shared selection: selecting a parcel opens it, deselecting collapses it.
   * An explicit close sticks until the selection moves elsewhere.
   */
  function syncPov(){
    if (!selectedParcelId){
      povDismissedFor = null;
      if (povParcelId) closePov();
      return;
    }
    if (povParcelId === selectedParcelId) return;
    if (povDismissedFor === selectedParcelId) return;
    if (camObjs.has(selectedParcelId)) openPov(selectedParcelId);
  }

  /** Live ortho|persp toggle: moves every gizmo and re-frames the POV shot. */
  function setProjection(p){
    projOverride = (p === "ortho" || p === "persp") ? p : null;
    rebuildCameras();
    if (povParcelId){
      const keep = povParcelId;
      povParcelId = null;                   // force openPov to redo the header
      openPov(keep);
    }
  }

  function buildCamStrip(map){
    const strip = document.getElementById("camStrip");
    strip.innerHTML = `<span class="dimmer">cameras:</span>` +
      (map.parcels || []).map(p =>
        `<button class="cambtn" data-cam="${esc(p.id)}" title="${esc(p.name || p.id)}">${esc(p.id)}</button>`
      ).join("");
  }

  // ------------------------------------------------------- visual state
  /**
   * Landmark ids inside the selected parcel, or null when nothing is selected
   * (in which case everything keeps its uniform appearance).
   */
  function selectionSet(){
    if (!selectedParcelId) return null;
    return insideByParcel.get(selectedParcelId) || new Set();
  }

  function applySelection(){
    const inSel = selectionSet();

    for (const [id, o] of parcelObjs){
      const on = id === selectedParcelId;
      o.edges.material.color.set(on ? 0xffb35a : 0x7f8ea3);
      o.edges.material.opacity = on ? 1.0 : (inSel ? DIM_ALPHA : 0.45);
      o.shell.material.color.set(on ? 0xffb35a : 0x7f8ea3);
      o.shell.material.opacity = on ? 0.10 : (inSel ? 0.012 : 0.04);
    }

    // pins: full strength inside the selected parcel, faint context outside
    for (const [id, o] of pinsByLm){
      const on = id === selectedLmId;
      o.mat.color.copy(o.baseColor);
      o.mat.opacity = (!inSel || inSel.has(id)) ? 1 : DIM_ALPHA;
      if (!o.mat.emissive) o.mat.emissive = new THREE.Color();
      o.mat.emissive.setHex(on ? 0x5a3c10 : 0x000000);
    }

    // edges: both ends inside = full; exactly one inside = this parcel's exit,
    // held at EXIT_ALPHA so the way out stays readable; neither = context
    for (const eo of edgeObjs){
      let f = 1;                                     // opacity factor on each part
      if (inSel){
        const n = (inSel.has(eo.edge.from) ? 1 : 0) + (inSel.has(eo.edge.to) ? 1 : 0);
        f = n === 2 ? 1 : n === 1 ? EXIT_ALPHA : DIM_ALPHA;
      }
      for (const part of eo.parts) part.mat.opacity = part.baseOpacity * f;
    }

    for (const [id, o] of camObjs){
      const on = id === selectedParcelId;
      o.gizMat.color.setHex(on ? 0xffb35a : 0x9ad0ff);
      o.gizMat.transparent = true;
      o.gizMat.opacity = on ? 1 : (inSel ? DIM_ALPHA : 1);
      o.frustum.material.color.setHex(on ? 0xffb35a : 0x6fd3ff);
      o.frustum.material.opacity = on ? 0.62 : (inSel ? 0.06 : 0.16);
      o.label.material.opacity = on ? 1 : (inSel ? 0.25 : 1);
    }

    for (const btn of document.querySelectorAll("#camStrip .cambtn"))
      btn.classList.toggle("on", btn.dataset.cam === selectedParcelId);
  }

  /**
   * Dimmed labels are hidden outright rather than faded: a wall of ghost text
   * over the selected scene is worse than no text. Hovering a dimmed pin still
   * brings its label back.
   */
  function applyLabels(){
    const inSel = selectionSet();
    for (const [id, sp] of labelByLm){
      const dimmed = !!inSel && !inSel.has(id);
      sp.visible = dimmed
        ? (id === hoveredId)
        : (state.labels || id === hoveredId || id === selectedLmId);
    }
  }

  function applyFrustums(){
    if (!camGroup) return;
    for (const [, o] of camObjs){
      o.frustum.visible = state.frustums;
      o.label.visible = state.frustums;
      o.holder.visible = true;                 // gizmos stay pickable
    }
  }

  // -------------------------------------------------------------- runtime
  function startLoop(){
    if (!ok || started) return;
    started = true;
    loop();
  }

  function resize(){
    if (!ok) return;
    const box = document.getElementById("view3d").getBoundingClientRect();
    if (box.width < 1 || box.height < 1) return;      // hidden behind a 2D tab
    const w = Math.round(box.width), h = Math.round(box.height);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  /**
   * Labels are world-space sprites, so they shrink with distance. Clamp the
   * on-screen height so they stay legible zoomed out and never dominate up
   * close.
   */
  function scaleLabels(cam, viewH){
    const proj = 1 / Math.tan(cam.fov * Math.PI / 360);
    for (const sp of labels){
      if (!sp.visible) continue;
      const d = Math.max(0.001, cam.position.distanceTo(sp.position));
      let px = LABEL_WORLD_H * proj * viewH / (2 * d);
      px = Math.min(LABEL_MAX_PX, Math.max(LABEL_MIN_PX, px));
      const wh = px * 2 * d / (proj * viewH);
      sp.scale.set(wh * sp.userData.aspect, wh, 1);
    }
  }

  /**
   * A fixed world size, used for the POV shot in BOTH projections: under ortho
   * there is no perspective divide so it is the only sensible size, and under
   * perspective letting the annotation shrink with depth is exactly right.
   * Kept smaller than the orbit view's: in the POV the labels sit over a framed
   * shot, and at full size they swamp it.
   */
  function scaleLabelsWorld(){
    for (const sp of labels){
      if (!sp.visible) continue;
      sp.scale.set(LABEL_POV_H * sp.userData.aspect, LABEL_POV_H, 1);
    }
  }

  /**
   * One rAF drives both renderers over the one Scene: the POV shot first, then
   * the orbit view. They are separate WebGL contexts, so each owns its own
   * framebuffer and there is no scissor state to leak between them; the only
   * shared mutable state is per-render sprite scaling and camGroup visibility,
   * both set immediately before the render call that reads them.
   */
  function loop(){
    raf = requestAnimationFrame(loop);
    if (!ok || !root) return;

    // --- POV shot: same scene, own renderer, in the sidebar --------------
    const povOn = povCam && povRenderer && !document.getElementById("povPanel").hidden;
    if (povOn){
      // the shot itself should not contain the camera rig that frames it
      camGroup.visible = false;
      scaleLabelsWorld();          // fixed world size in both projections
      povRenderer.render(scene, povCam);
      camGroup.visible = true;
    }

    // --- main orbit view ------------------------------------------------
    if (mainActive && !document.getElementById("view3d").hidden){
      scaleLabels(camera, renderer.domElement.clientHeight || 1);
      renderer.render(scene, camera);
    }
  }

  return {
    available(){ return typeof THREE !== "undefined"; },
    build,
    /**
     * The loop stays alive across view switches: the POV panel lives in the
     * sidebar now, so it must keep rendering while the 2D tabs are showing.
     * `mainActive` gates only the orbit view's render call.
     */
    show(){
      if (!init()) return;
      mainActive = true;
      resize();
      startLoop();
    },
    hide(){ mainActive = false; },
    setSelectedParcel(id){
      selectedParcelId = id;
      if (root){ applySelection(); applyLabels(); syncPov(); }
    },
    setLabels(){ if (root) applyLabels(); },
    setFrustums(){ if (root) applyFrustums(); },
    openPov, closePov, setProjection,
    projection(){ return projOverride; },
    closeCard(){ hideCard(); selectedLmId = null; if (root){ applySelection(); applyLabels(); } },
    cameraSpec(parcelId){ const e = camObjs.get(parcelId); return e ? e.spec : null; },
    _dbg(){ return { scene, camera, povCam, renderer, povRenderer, root,
                     camObjs, labels, edgeObjs, insideByParcel, projOverride,
                     povParcelId, selectedParcelId }; },
  };
})();
// ================================================================== render
function render(){
  const views2d = document.getElementById("views2d");
  const view3d  = document.getElementById("view3d");
  // only #sideBody is rebuilt: #povPanel is a sibling and owns a WebGL context
  const sideEl  = document.getElementById("sideBody");

  if (state.loadError){
    document.getElementById("townName").textContent = state.town;
    views2d.innerHTML = `<div class="err-box">Failed to load
      <code>${esc(state.town)}.map.json</code><br><br>${esc(state.loadError)}</div>`;
    view3d.hidden = true; TV.hide();
    document.getElementById("povPanel").hidden = true;
    sideEl.innerHTML = "";
    return;
  }
  const map = state.map;
  if (!map){ views2d.innerHTML = `<p class="muted">loading…</p>`; return; }

  document.getElementById("townName").textContent = map.displayName || map.town || state.town;
  document.getElementById("premise").textContent = map.premise || "";
  document.getElementById("townInput").value = state.town;
  for (const b of document.querySelectorAll("#viewSeg button"))
    b.classList.toggle("on", b.dataset.view === state.view);
  document.getElementById("btnLabels").classList.toggle("on", state.labels);
  document.getElementById("btnFrustums").classList.toggle("on", state.frustums);

  // --- 3D main panel vs the 2D projection tabs --------------------------
  const is3d = state.view === "3d";
  view3d.hidden = !is3d;
  if (is3d){
    views2d.innerHTML = "";
    TV.show();
  } else {
    TV.hide();
    const views = state.view === "both" ? ["elevation","plan"] : [state.view];
    const subtitle = { elevation:"x horizontal, z vertical (height) — primary for this cliff town",
                       plan:"x horizontal, y vertical (cliff 0 at top -> river below)" };
    views2d.innerHTML = views.map(v =>
      `<div class="viewblock"><h2>${v} <span>— ${esc(subtitle[v])}</span></h2>${renderSvg(map, v)}</div>`
    ).join("");
  }
  TV.setSelectedParcel(state.selected);
  TV.setLabels();
  TV.setFrustums();

  const { contracts } = deriveContracts(map);
  const sel = contracts.find(c => c.parcel.id === state.selected) || null;
  sideEl.innerHTML = renderParcelList(map, contracts)
                   + renderContract(map, sel)
                   + renderValidation(map)
                   + renderLegend(map);

  // fill the fallback textarea with the brief up-front
  if (sel){
    const ta = document.getElementById("briefText");
    if (ta) ta.value = parcelBrief(map, sel);
  }
}

// ================================================================== events
/**
 * The one selection state, shared by the 2D views, the 3D parcel boxes, the
 * camera gizmos, the camera strip and the contract panel.
 * `force` suppresses the toggle-off behaviour (opening a POV should select,
 * never deselect).
 */
function selectParcel(id, force){
  state.selected = (!force && state.selected === id) ? null : id;
  render();
}

document.addEventListener("click", ev => {
  const row = ev.target.closest(".parcelrow, .parcel");
  if (row && row.dataset.parcel){ selectParcel(row.dataset.parcel); return; }

  const cam = ev.target.closest("#camStrip .cambtn");
  if (cam){ TV.openPov(cam.dataset.cam); return; }

  const proj = ev.target.closest("#povProj button");
  if (proj){ TV.setProjection(proj.dataset.proj); return; }

  if (ev.target.closest("#povClose")){ TV.closePov(true); return; }
  if (ev.target.closest("#lmCard .close")){ TV.closeCard(); return; }

  const copy = ev.target.closest("#copyBrief");
  if (copy){
    const map = state.map;
    const { contracts } = deriveContracts(map);
    const c = contracts.find(k => k.parcel.id === copy.dataset.parcel);
    if (!c) return;
    const md = parcelBrief(map, c);
    const status = document.getElementById("copyStatus");
    const ta = document.getElementById("briefText");
    if (ta) ta.value = md;
    const fallback = msg => {
      status.textContent = msg + " — copy from the box below:";
      status.className = "sev-warn";
      const d = document.getElementById("briefDetails");
      if (d) d.open = true;
      if (ta){ ta.focus(); ta.select(); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(md).then(() => {
        status.textContent = `copied (${md.length} chars)`;
        status.className = "sev-ok";
        setTimeout(() => { status.textContent = ""; }, 2500);
      }).catch(e => fallback("clipboard blocked"));
    } else fallback("no clipboard API");
    return;
  }

  const vb = ev.target.closest("#viewSeg button");
  if (vb){ state.view = vb.dataset.view; render(); return; }
  if (ev.target.closest("#btnLabels")){ state.labels = !state.labels; render(); return; }
  if (ev.target.closest("#btnFrustums")){ state.frustums = !state.frustums; render(); return; }
  if (ev.target.closest("#btnReload")){ load(state.town); return; }
});

document.getElementById("townInput").addEventListener("keydown", ev => {
  if (ev.key === "Enter"){
    const t = ev.target.value.trim();
    if (t){
      const u = new URL(location.href);
      u.searchParams.set("town", t);
      history.replaceState(null, "", u);
      load(t);
    }
  }
});

// ==================================================================== load
async function load(town){
  state.town = town;
  state.map = null;
  state.loadError = null;
  state.selected = null;
  render();
  try {
    const res = await fetch(`${encodeURIComponent(town)}.map.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const map = await res.json();
    if (!map.parcels || !map.landmarks) throw new Error("missing landmarks/parcels arrays");
    state.map = map;
  } catch (e){
    state.loadError = e.message || String(e);
  }
  // The JSON is the model: rebuilding the 3D scene is the whole update path.
  if (state.map && TV.available()) TV.build(state.map);
  render();
}
