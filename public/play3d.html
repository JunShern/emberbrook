function occCheck(){ if(RT||!cam){occRing.visible=occDia.visible=false;return;}
  if(++occT%6)return;                                  // every 6th frame is plenty
  const tgt=new THREE.Vector3(P.x,(AIR?airY:P.y)+0.9,P.z);
  occRay.set(cam.position.clone(),tgt.clone().sub(cam.position).normalize());
  occRay.far=cam.position.distanceTo(tgt)-0.3;
  const hit=occRay.intersectObjects(collide,true).find(h=>{
    if(DEPTH) return true;                             // depth-map mode: nothing is ghosted, any solid counts
    const m=h.object.material; return !(m&&m.depthWrite===false); });  // ghosted overheads don't count

const spr=new THREE.Mesh(new THREE.PlaneGeometry(2.05,2.05),new THREE.MeshBasicMaterial({map:sheet,alphaTest:.5,side:THREE.DoubleSide}));

  const k=MODEL_H/sz.y; model.scale.setScalar(k);

  mixer=new THREE.AnimationMixer(model);
  const clips=g.animations||[];
  const pick=re=>clips.find(c=>re.test(c.name));

});
function setAct(a){ if(!mixer||a===actCur) return; a.reset().fadeIn(0.15).play(); if(actCur)actCur.fadeOut(0.15); actCur=a; }
const DIRS={down:{row:CFG.down.row,n:CFG.down.n,m:false},up:{row:CFG.up.row,n:CFG.up.n,m:false},
  left:{row:CFG.side.row,n:CFG.side.n,m:false},right:{row:CFG.side.row,n:CFG.side.n,m:true}};
let sdir='down',stick=0; function setF(d,i){const o=DIRS[d];sheet.offset.set((i%o.n)/CFG.cols,1-(o.row+1)/CFG.rows);spr.scale.x=o.m?-1:1;} setF('down',0);
// world + collision
let cam, collide=[], walkRef=[], allMeshes=[], DEBUG=false, P={x:0,y:2,z:0}, RAD=.42, STEP_UP=.63, STEP_DN=.8, SPD=.075;
// body volume used for blocking (an AABB, not a ray fan — see wall()/blocked()):
// BODY_R = half-width (snag radius; RAD stays the circumscribed radius), BODY_H = collide height.
let BODY_R=.30, BODY_H=1.30, JUMP_V=5.4, GRAV=14.5, DROP_MAX=8;
let lastSafe=null;  // last grounded standable spot (void-fall respawn)
let lastRoute=null; // last grounded spot that was ON the designed walk network (stuck-recovery)
const keys={}; addEventListener('keydown',e=>{if(e.key===' ')e.preventDefault();keys[e.key.toLowerCase()]=1}); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

const ray=new THREE.Raycaster(), DOWN=new THREE.Vector3(0,-1,0);
const wn=h=>h.face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(h.object.matrixWorld)).normalize();

// excluding legacy invisible bar_ boxes (they block but are not floors)
// down-ray against a mesh list, with a cached-world-AABB column prefilter: only the
// few meshes actually over (x,z) are raycast (interiors/town run ~900 collide meshes,
// so intersectObjects over the whole list per probe was the real per-frame cost).
const _o3=new THREE.Vector3(), _hits=[];
function colTops(list,x,z,fromY,depth,skipBar){
  ray.set(_o3.set(x,fromY,z),DOWN); ray.far=depth;

function topsAt(x,z,fromY,depth){ return colTops(collide,x,z,fromY,depth,true); }
function ground(x,z,fy){

    const t2=topsAt(x+ox,z+oz,fy+STEP_UP+.1,STEP_UP+STEP_DN+.2); if(t2.length) return t2[0]; }
  return null; }

// ---- volume blocking -------------------------------------------------------

const _bx=new THREE.Box3(), _lo=new THREE.Vector3(), _hi=new THREE.Vector3();

// ===== NETWORK COLLISION (?net=<town>) ========================================

let NET=null;
async function loadNet(town){

 tick(n){for(let i=0;i<(n||1);i++)phys(); ch.position.set(P.x,AIR?airY:P.y,P.z); R.render(scene,cam); return{...P,AIR,airY}},
 tp(x,z,y){P.x=x;P.z=z;if(y!=null)P.y=y;else{const g=ground(x,z,P.y);if(g!=null)P.y=g;}AIR=false;jvy=0;lastSafe={x:P.x,y:P.y,z:P.z};ch.position.set(P.x,P.y,P.z);return{...P}},
 tpY(x,z,ty){const ys=(walkRef.length?walkFloors(x,z):floors(x,z));if(ys.length){let b=ys[0];for(const y of ys)if(Math.abs(y-ty)<Math.abs(b-ty))b=y;P.x=x;P.z=z;P.y=b}ch.position.set(P.x,P.y,P.z);R.render(scene,cam);return{...P}},
 depthQuad(v){if(DEPTH){DEPTH.quad.visible=!!v;R.render(scene,cam);}return !!DEPTH},
 paint(){let n=0;if(model)model.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshBasicMaterial({color:0xff00ff,depthTest:false});o.renderOrder=998;n++;}});
   R.render(scene,cam);
   const gl=R.getContext(),w=200,h=250,px=new Uint8Array(w*h*4);
   gl.readPixels(572,768-664,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);   // buffer region around char NDC
   let mag=0;for(let i=0;i<w*h;i++){if(px[i*4]>200&&px[i*4+2]>200&&px[i*4+1]<80)mag++;}
   return{meshes:n,magentaPixels:mag}},
 cam(){const f=new THREE.Vector3(0,0,-1).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
   const s=new THREE.Vector3(P.x,P.y+0.9,P.z).project(cam);
   return{pos:cam.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(2)),
     fwd:f.toArray().map(v=>+v.toFixed(3)),fov:cam.fov,aspect:cam.aspect,
     charNdc:[+s.x.toFixed(2),+s.y.toFixed(2),+s.z.toFixed(3)]}},
 char(){return{model:!!model,children:ch.children.length,chPos:ch.position.toArray(),
   inScene:!!ch.parent,scale:model?model.scale.x:0,visible:ch.visible,
   modelWorldY:model?new THREE.Box3().setFromObject(model).max.y:null}},
 occ(){const tgt=new THREE.Vector3(P.x,(AIR?airY:P.y)+0.9,P.z);
   occRay.set(cam.position.clone(),tgt.clone().sub(cam.position).normalize());
   occRay.far=cam.position.distanceTo(tgt)-0.3;
   const hits=occRay.intersectObjects(collide,true);
   return{depthMode:!!DEPTH,ring:occRing.visible,nHits:hits.length,
     first:hits[0]?{name:hits[0].object.name,dist:+hits[0].distance.toFixed(2)}:null,
     camDist:+cam.position.distanceTo(tgt).toFixed(2)}}};
// ===== SCENE GRAPH + TRANSITIONS ============================================
// The layer that makes the scenes ONE GAME. Everything it knows comes from
// public/world/scenegraph.json (generated by tools/scenegraph_derive.mjs from the
// map files): which edges leave this scene, where their triggers are, what they
// are called, how far, how long the fade is. There is deliberately NO scene key,
// landmark id, radius, label or timing in this code — adding a door, a portal or
// a whole town is a map edit plus a generator re-run, never a code change.
//
// Everything below is ADDITIVE: one call from loop() (sgTick), one keydown
// listener, one arrival branch in the spawn chain, and Object.assign onto SIM.
// Collision, occlusion, the camera and the existing spawn sources are untouched.
//
// FOR THE CAMERA-SCENE NAVIGATION LAYER: an edge with to === from is a handoff
// INSIDE this scene — transitionTo() fades, moves the player, calls applyCam()
// and fades back in without a page load. That is the seam for townwalk->townwalk
// camera cuts: author the edges in the generator, fill in `cam`, and teach
// applyCam() (below, currently a documented no-op) to consume it. Edge selection,
// arming, the prompt and the fade never need to know it happened.
let SG=null, SGE=[], SGD={}, SGnear=null, SGbusy=false, SGbanner=null, SGfade=null;
const sgDef=(k,d)=>SGD[k]!==undefined?SGD[k]:d;
fetch('world/scenegraph.json?v='+Date.now()).then(r=>r.ok?r.json():null).then(j=>{
  if(!j) return;
  SG=j; SGD=j.defaults||{};
  // armed=null means "not yet decided": sgTick decides on the first frame the
  // player is placed, so the graph and the GLB can load in either order.
  SGE=(j.edges||[]).filter(e=>e.from===SCENE).map(e=>Object.assign({},e,{armed:null}));
  if(SGE.length) hud.textContent+=' · '+SGE.length+' exits';
}).catch(()=>{});
// --- the fade veil (also the "opened from a transition" fade-in) --------------
function sgVeil(){ if(SGfade) return SGfade;
  SGfade=document.createElement('div');
  SGfade.style.cssText='position:fixed;inset:0;background:#000;z-index:9;pointer-events:none;opacity:0';
  document.body.appendChild(SGfade); return SGfade; }
function sgFade(to,ms){ const v=sgVeil();
  v.style.transition='opacity '+ms+'ms linear'; v.style.opacity=String(to);
  return new Promise(r=>setTimeout(r,ms+20)); }
let SGopened=false;
function sgOpen(){ if(SGopened) return; SGopened=true;          // first frame: fade in
  if(!Q.get('fade')) return;
  const v=sgVeil(); v.style.opacity='1';
  // setTimeout, NOT rAF: rAF is throttled to nothing in a background tab, which
  // would leave a headless test (and a tabbed-away player) staring at black.
  setTimeout(()=>sgFade(0, sgDef('fadeMs',350)), 16); }
if(Q.get('fade')){ const v=sgVeil(); v.style.transition='none'; v.style.opacity='1';
  setTimeout(sgOpen, 8000); }   // never leave a player staring at black if a load stalls
// --- the prompt: a small non-modal HUD banner, styled like the HUD ------------
function sgPrompt(e){
  if(!SGbanner){ SGbanner=document.createElement('div');
    SGbanner.id='sgp';
    SGbanner.style.cssText='position:absolute;left:50%;bottom:8%;transform:translateX(-50%);'+
      'z-index:3;color:#e7ddd0;font:14px monospace;background:#000b;border:1px solid #3a2c20;'+
      'border-radius:8px;padding:7px 14px;text-shadow:0 1px 2px #000;pointer-events:none;'+
      'white-space:nowrap;opacity:0;transition:opacity 120ms linear';
    el.appendChild(SGbanner); }
  if(!e){ SGbanner.style.opacity='0'; return; }
  const k=(e.key||sgDef('key','e')).toUpperCase();
  SGbanner.innerHTML=sgDef('promptFmt','{label}? [{key}]')
    .replace('{label}', e.label).replace('{key}','<b style="color:#e9a24b">'+k+'</b>');
  SGbanner.style.opacity='1';
}
// --- per-frame edge test -----------------------------------------------------
// Nearest in-range edge wins, so two doors close together never fight. The |dy|
// gate matters in a town that stacks tiers: without it a quay door would trigger
// through the street above it.
function sgHit(e){
  const y=(AIR?airY:P.y);
  const d=Math.hypot(P.x-e.at[0], P.z-e.at[2]);
  return {d, dy:Math.abs(y-e.at[1]),
          in: d<=e.r && Math.abs(y-e.at[1])<=(e.vTol!==undefined?e.vTol:sgDef('vTol',2))};
}
function sgTick(){
  sgOpen();
  if(!SG||SGbusy) return;
  let best=null;
  for(const e of SGE){ const h=sgHit(e);
    // ARRIVAL SUPPRESSION: interiors spawn ON their door pad, which IS the exit
    // trigger — so an edge that already contains you when you arrive starts
    // DISARMED and arms the moment you step out of it. Also kills any chance of
    // a transition ping-ponging on the frame it lands.
    if(e.armed===null){ e.armed=!h.in; continue; }
    if(!h.in){ e.armed=true; continue; }
    if(e.armed && (!best||h.d<best.h.d)) best={e, h};
  }
  const nx=best?best.e:null;
  if(nx!==SGnear){ SGnear=nx; sgPrompt(nx); }
}
addEventListener('keydown',ev=>{
  if(ev.repeat||SGbusy||!SGnear) return;
  if(ev.key.toLowerCase()!==(SGnear.key||sgDef('key','e'))) return;
  transitionTo(SGnear);
});
// --- THE SWAP SEAM -----------------------------------------------------------
// transitionTo() is the ONLY place a scene change happens. Edge selection,
// arming and the prompt call it and know nothing about how it works, which is
// the point: tonight's strategy is a state-free full page load (robust, no
// leaked state, correct by construction), and it is a DESIGNATED REFINEMENT
// TARGET — a preloaded in-place bundle swap with persistent party state can
// replace the body of this one function without touching anything above.
function sgUrl(e){
  const n=(SG.nodes||{})[e.to]||{}, q=new URLSearchParams();
  q.set('scene', e.to);
  for(const k in (n.params||{})) q.set(k, n.params[k]);
  if(Q.has('char')) q.set('char', Q.get('char'));
  if(Q.has('sprite')) q.set('sprite', Q.get('sprite'));
  q.set('sx', e.spawn[0]); q.set('sy', e.spawn[1]); q.set('sz', e.spawn[2]);
  if(e.spawnYaw!=null) q.set('yaw', e.spawnYaw);
  q.set('fade','1'); q.set('v', Date.now());
  return 'play3d.html?'+q.toString();
}
function transitionTo(e){
  if(SGbusy) return null;
  SGbusy=true; SGnear=null; sgPrompt(null);
  const ms=sgDef('fadeMs',350), url=sgUrl(e), local=(e.to===SCENE);
  sgFade(1,ms).then(()=>{
    if(!local){ location.assign(url); return; }
    sgHandoff(e);
    sgFade(0,ms).then(()=>{SGbusy=false;});
  });
  return {url, local};
}
// same-scene handoff: no reload. This is the camera layer's mechanism.
function sgHandoff(e){
  sgPlace(e.spawn);
  if(e.spawnYaw!=null&&window.ORBIT) window.ORBIT.yaw=e.spawnYaw;
  applyCam(e.cam);
  for(const x of SGE) x.armed=null;          // re-decide suppression at the new spot
}
// RESERVED SEAM for the camera-scene navigation layer. `cam` is whatever the
// scene-graph generator chooses to put in an edge (a named camera from the map's
// camera hints, or an explicit {pos,target,fov}); nothing else in this file reads
// it, so teaching the game camera cuts is a change to this function plus data.
function applyCam(cam){ if(!cam) return; window.__sgCam=cam; }
// place the player at an arrival point: snap to the walk network if there is one
// under it (the graph's heights come from the same meshes, so this is a 1-2cm
// correction), else to any floor, else trust the point.
function sgPlace(p){
  let ys=(walkRef.length?walkFloors(p[0],p[2]):[]);
  if(!ys.length) ys=floors(p[0],p[2]);
  P.x=p[0]; P.z=p[2];
  P.y=ys.length?ys.reduce((a,b)=>Math.abs(a-p[1])<Math.abs(b-p[1])?a:b):p[1];
  AIR=false; jvy=0; CURF=null;
  lastSafe={x:P.x,y:P.y,z:P.z};
  ch.position.set(P.x,P.y,P.z);
  return {...P};
}
// --- headless test surface ---------------------------------------------------
Object.assign(window.SIM,{
  // every edge out of this scene, with live distances and arm state
  edges(){ return SGE.map((e,i)=>{ const h=sgHit(e);
    return {i, id:e.id, kind:e.kind, to:e.to, label:e.label, at:e.at, r:e.r,
            dist:+h.d.toFixed(2), dy:+h.dy.toFixed(2), inRange:h.in, armed:e.armed,
            spawn:e.spawn}; }); },
  // take an edge as if the player pressed its key. {navigate:false} returns the
  // URL without leaving the page (so a test can assert the target and spawn).
  go(i,opt){ const e=SGE[i]; if(!e) return {error:'no edge '+i};
    if(opt&&opt.navigate===false) return {id:e.id, url:sgUrl(e), local:e.to===SCENE};
    const r=transitionTo(e); return r?{id:e.id, ...r}:{error:'busy'}; },
  // what the player can see right now
  prompt(){ return SGnear?{id:SGnear.id,label:SGnear.label,key:SGnear.key||sgDef('key','e'),
    text:SGbanner?SGbanner.textContent:null, visible:!!(SGbanner&&SGbanner.style.opacity==='1')}:null; },
  graph(){ return SG?{version:SG.version,generated:SG.generated,nodes:Object.keys(SG.nodes||{}),
    defaults:SGD, scene:SCENE, edges:SGE.length}:null; },
  place:sgPlace, arrival(){ return URLSPAWN; },
  // TEST-ONLY: inject an edge this scene did not ship with. It exists so the
  // scene-internal handoff (to === from, the camera layer's mechanism) can be
  // exercised before any such edge is authored in the generator — and so a future
  // camera edge can be prototyped live before it goes into the map pipeline.
  addEdge(e){ SGE.push(Object.assign({r:sgDef('doorRadius',1.8), key:sgDef('key','e'),
    kind:'test', label:'TEST', from:SCENE, id:'test'+SGE.length}, e, {armed:null}));
    return SGE.length-1; },
});
</script>
