let lastRoute=null; // last grounded spot that was ON the designed walk network (stuck-recovery)

const ray=new THREE.Raycaster(), DOWN=new THREE.Vector3(0,-1,0);
const wn=h=>h.face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(h.object.matrixWorld)).normalize();
const isBar=o=>{let p=o;while(p){if(/^bar_/i.test(p.name))return true;p=p.parent;}return false;};

// excluding legacy invisible bar_ boxes (they block but are not floors)
// down-ray against a mesh list, with a cached-world-AABB column prefilter: only the
// few meshes actually over (x,z) are raycast (interiors/town run ~900 collide meshes,
// so intersectObjects over the whole list per probe was the real per-frame cost).
const _o3=new THREE.Vector3(), _hits=[];

    if(w&&(x<w.min.x||x>w.max.x||z<w.min.z||z>w.max.z||w.max.y<lo||w.min.y>fromY)) continue;
    if(skipBar&&isBar(o)) continue;
    o.raycast(ray,_hits);

function topsAt(x,z,fromY,depth){ return colTops(collide,x,z,fromY,depth,true); }
function ground(x,z,fy){ const t=topsAt(x,z,fy+STEP_UP+.1,STEP_UP+STEP_DN+.2); return t.length?t[0]:null; }

function walkFloors(x,z){ return colTops(walkRef,x,z,80,160,false); }

// is intersected against the real triangles via each mesh's BVH (world-AABB prefilter
// first, so only a handful of meshes are ever descended). ~0.04ms per query @919 meshes.
const _bx=new THREE.Box3(), _lo=new THREE.Vector3(), _hi=new THREE.Vector3();

// off — the walker squeezes out but still can never tunnel through a wall or a table.
const SLIM=.35;
// legacy signature kept for callers/tests: "is a move of (dx,dz) from (x,z) blocked"
function wall(x,z,dx,dz,fy){ return !!blocked(x+dx,z+dz,fy); }

function walkStep(dx,dz){

let NET=null;

function featAt(x,z){ // all features containing (x,z), with their y there

  let best=null;
  for(let x=bb.min.x;x<=bb.max.x;x+=stepX)for(let z=bb.min.z;z<=bb.max.z;z+=stepZ){
    const f=(walkRef.length?walkFloors(x,z):floors(x,z));
    if(f.length){const y=Math.max(...f); const d=Math.abs(x-cx)+Math.abs(z-cz); if(!best||d<best.d)best={x,z,y,d};}}
  if(best && !doorPad){P.x=best.x;P.z=best.z;P.y=best.y;}
  hud.textContent=`${SCENE} · ${CHAR} · WASD`; loop();
});
// debug overlay: swap every mesh between invisible-depth and its debug material; dim the backdrop
let dbgLegend=null, bgSaved=null;
function applyDebug(){
  for(const o of allMeshes){
    o.material = DEBUG ? o.userData.dbgMat : o.userData.hideMat;
    o.renderOrder = DEBUG ? (o.userData.isWalk?2:1) : -1;   // walk floors on top of object wireframes
  }
  // keep the stylized backdrop visible so geometry-vs-art ALIGNMENT is directly checkable;
  // '2' blanks it for mesh-only inspection
  if(DEBUG && BLANK){ if(scene.background){ bgSaved=scene.background; scene.background=null; el.style.background='#0c1016'; } }
  else { if(bgSaved){ scene.background=bgSaved; bgSaved=null; el.style.background='#000'; } }
  if(!dbgLegend){
    dbgLegend=document.createElement('div');
    dbgLegend.style.cssText='position:fixed;top:6px;right:8px;z-index:3;font:12px monospace;color:#e7ddd0;background:#000a;padding:8px 10px;border-radius:6px;line-height:1.7';
    dbgLegend.innerHTML='<b>DEBUG (G to hide)</b><br><span style="color:#2fff6a">■</span> walkable surface<br><span style="color:#5ab4ff">▦</span> object mesh (occlusion)<br>character shows its true 3D pos';
    document.body.appendChild(dbgLegend);
  }
  dbgLegend.style.display = DEBUG ? 'block' : 'none';
}
function fwd(){const f=new THREE.Vector3();cam.getWorldDirection(f);f.y=0;f.normalize();return{f,r:new THREE.Vector3(-f.z,0,f.x)};}
// one physics tick (60Hz). Split out of loop() so tests can drive the sim in a
// background tab, where rAF is throttled: SIM.tick(n).
function phys(inp){
 const{f,r}=fwd();let dx=0,dz=0;
 if(inp){ dx=inp[0]; dz=inp[1]; }
 else{ if(keys.w||keys.arrowup){dx+=f.x;dz+=f.z}if(keys.s||keys.arrowdown){dx-=f.x;dz-=f.z}if(keys.d||keys.arrowright){dx+=r.x;dz+=r.z}if(keys.a||keys.arrowleft){dx-=r.x;dz-=r.z} }
 const l=Math.hypot(dx,dz);
 if(l){ if(AIR){ const mx=dx/l*SPD, mz=dz/l*SPD, r=airBlocked(P.x,P.z,airY)?BODY_R*SLIM:BODY_R;
          if(!airBlocked(P.x+mx,P.z+mz,airY,r)){P.x+=mx;P.z+=mz;}
          else if(!airBlocked(P.x+mx,P.z,airY,r)){P.x+=mx;}
          else if(!airBlocked(P.x,P.z+mz,airY,r)){P.z+=mz;} }
        else step(dx/l*SPD,dz/l*SPD); }
 if(!AIR){ lastSafe={x:P.x,y:P.y,z:P.z};
   if(walkRef.length&&walkFloors(P.x,P.z).some(y=>Math.abs(y-P.y)<.25)) lastRoute={x:P.x,y:P.y,z:P.z}; }
 if(keys[' ']&&!AIR){ AIR=true; jvy=JUMP_V; airY=P.y; if(!SPRITE&&actJump&&mixer){ setAct(actJump); } }
 if(AIR){
   airY+=jvy/60; jvy-=GRAV/60;
   if(jvy<0){
     const tops=floors(P.x,P.z).filter(y=>y<=airY+0.06);
     const top=tops.length?Math.max(...tops):null;
     if(top!==null&&airY<=top){ AIR=false; jvy=0; P.y=top; if(!SPRITE&&mixer)setAct(l?actWalk:actIdle); }
     else if(top===null&&lastSafe&&airY<lastSafe.y-8){ AIR=false; jvy=0; P.x=lastSafe.x; P.z=lastSafe.z; P.y=lastSafe.y; }
   }
 }
 return{dx,dz,l,f,r};
}
function loop(){requestAnimationFrame(loop);
 const S=phys(), f=S.f, r=S.r, dx=S.dx, dz=S.dz, l=S.l;
 ch.position.set(P.x, AIR?airY:P.y, P.z);
 if(SPRITE){ if(l){const aF=dx*f.x+dz*f.z,aR=dx*r.x+dz*r.z;sdir=Math.abs(aF)>=Math.abs(aR)?(aF>0?'up':'down'):(aR>0?'right':'left');stick=(stick+1)%(DIRS[sdir].n*5);setF(sdir,Math.floor(stick/5));}else setF(sdir,0);}
 else { if(mixer)mixer.update(clock.getDelta());
   if(AIR){ if(model&&l) ch.rotation.y=Math.atan2(dx,dz); }
   else if(l){ setAct(actWalk); if(model) ch.rotation.y=Math.atan2(dx,dz); }
   else setAct(actIdle); }
 if(RT){ if(!window._rtCam){ window._rtCam=new THREE.PerspectiveCamera(42, W/H, 0.1, 400);
     window.ORBIT={yaw:Math.PI*0.25, pitch:0.62, dist:16, panX:0, panY:0, panZ:0};
     const cv=R.domElement; let drag=null;
     cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};if(drag.pan)e.preventDefault();});
     addEventListener('mouseup',()=>drag=null);
     addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
       if(drag.pan){const c=Math.cos(ORBIT.yaw),si=Math.sin(ORBIT.yaw),k=ORBIT.dist*0.0016;
         ORBIT.panX+=(-dx*c)*k+(dy*si)*k; ORBIT.panZ+=(dx*si)*k+(dy*c)*k;}
       else{ORBIT.yaw-=dx*0.008; ORBIT.pitch=Math.max(0.12,Math.min(1.35,ORBIT.pitch+dy*0.006));}});
     cv.addEventListener('wheel',e=>{e.preventDefault();ORBIT.dist=Math.max(4,Math.min(70,ORBIT.dist*(1+Math.sign(e.deltaY)*0.1)));},{passive:false});
     cv.addEventListener('contextmenu',e=>e.preventDefault());
   }
   cam=window._rtCam;
   const O=window.ORBIT, tx=P.x+O.panX, ty=P.y+1+O.panY, tz=P.z+O.panZ;
   cam.position.set(tx+Math.cos(O.yaw)*Math.cos(O.pitch)*O.dist,
                    ty+Math.sin(O.pitch)*O.dist,
                    tz+Math.sin(O.yaw)*Math.cos(O.pitch)*O.dist);
   cam.lookAt(tx,ty,tz); }
 if(SPRITE) ch.rotation.y=Math.atan2(cam.position.x-P.x,cam.position.z-P.z);
 R.render(scene,cam);
 hud.textContent=`${SCENE} · ${CHAR} · pos(${P.x.toFixed(1)},${P.y.toFixed(1)},${P.z.toFixed(1)})${RT?' · drag:orbit wheel:zoom shift-drag:pan':''} · G:debug${DEBUG?' ON':''}`;}
window.SIM={pos(){return{...P}},floors,walkFloors,netY:(x,z,fy)=>NET?netY(x,z,fy):null,
 // --- test harness (rAF is throttled in background tabs; drive the sim by hand) ---
 ground,blocked:(x,z,fy)=>{const o=blocked(x,z,fy);return o?o.name:null},
 air(){return{AIR,airY,jvy}},
 key(k,v){keys[String(k).toLowerCase()]=v?1:0},
 // one tick with an explicit WORLD-space direction (camera-independent walk tests)
 move(dx,dz,n){for(let i=0;i<(n||1);i++)phys([dx,dz]); return AIR?{x:P.x,y:airY,z:P.z,AIR:true}:{...P,AIR:false}},
 keys(o){for(const k in keys)keys[k]=0; if(o)for(const k in o)keys[String(k).toLowerCase()]=o[k]?1:0},
 tick(n){for(let i=0;i<(n||1);i++)phys(); ch.position.set(P.x,AIR?airY:P.y,P.z); R.render(scene,cam); return{...P,AIR,airY}},
 tp(x,z,y){P.x=x;P.z=z;if(y!=null)P.y=y;else{const g=ground(x,z,P.y);if(g!=null)P.y=g;}AIR=false;jvy=0;lastSafe={x:P.x,y:P.y,z:P.z};ch.position.set(P.x,P.y,P.z);return{...P}},
 tpY(x,z,ty){const ys=(walkRef.length?walkFloors(x,z):floors(x,z));if(ys.length){let b=ys[0];for(const y of ys)if(Math.abs(y-ty)<Math.abs(b-ty))b=y;P.x=x;P.z=z;P.y=b}ch.position.set(P.x,P.y,P.z);R.render(scene,cam);return{...P}}};
</script>
