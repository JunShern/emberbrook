<script>
// Generalized FF-hybrid runtime: loads any migrated scene bundle
//   ?scene=<key>  (public/assets/scenes/<key>/{stylized.png,scene.glb})   default dellhollow3d
//   ?char=<key>   (HD-2D sheet in public/assets/characters3d/<key>.png)   default vesper
// Renders: stylized backdrop + invisible depth geometry (occlusion) + depth-occluded
// billboard character with raycast collision. This is the reference impl for render3d.js.
// ===== PAGE PARAMETERS vs SCENE PARAMETERS ==================================
// The distinction below is the whole basis of the in-place scene swap. A PAGE
// parameter is a property of this browser tab and outlives every transition (the
// character, the renderer, the model choice). A SCENE parameter is a property of
// THE BUNDLE CURRENTLY LOADED and is rewritten wholesale by sceneParams() every
// time a door is taken. Anything that reads a scene parameter therefore has to
// read the live binding, never a captured copy — which is why they are `let`.
const Q0=new URLSearchParams(location.search);

// every transition this tab takes (it is propagated through sgUrl, so the whole
// journey stays on the old path, not just the first door). It is the escape hatch
// for anything the in-place swap gets wrong, and both paths are kept working.
const RELOAD=Q0.get('reload')==='1';
let Q=Q0, SCENE, RT, WALKLOCK, URLSPAWN, URLYAW, BASE, OWCAM;
function sceneParams(q){

  // WALKLOCK (user ruling 2026-07-31): in the routed town scenes the walk network is
  // LAW — walking never drops off an edge onto a lower floor (the old "anything you
  // can climb onto you can get down from" ledge rule made the player fall off routes
  // constantly). Jumping (Space) remains the deliberate way down. ?walklock=0 reverts.
  WALKLOCK=/^(del-|emb-|townwalk)/.test(SCENE)&&q.get('walklock')!=='0'&&(function(){try{return localStorage.getItem('eb-walklock')!=='0';}catch(e){return true;}})();

  // ?sx&sy&sz place the player explicitly: this is how one scene hands off to the
  // next. It OUTRANKS every other spawn source (meta.json pin, baked depth spawn,
  // door pad, centre scan) because it is an act of navigation, not a scene default.
  // ?yaw pins the real-time follow camera's start heading; ?fade=1 opens black.
  URLSPAWN = (q.has('sx')&&q.has('sz'))
    ? [parseFloat(q.get('sx')), parseFloat(q.get('sy')||'0'), parseFloat(q.get('sz'))] : null;
  URLYAW = q.has('yaw') ? parseFloat(q.get('yaw')) : null;

  // player's walking direction (~100 ft equivalent at miniature scale). Applies to
  // ow-* scenes; drag/wheel still work, the yaw eases back to heading while moving.
  OWCAM = /^ow-/.test(SCENE);

sceneParams(Q0);
const W=1344,H=768;
// per-character sheet layout (cols,rows,dirs); extend as cast is added
const SHEETS={ vesper:{cols:6,rows:3,down:{row:0,n:4},up:{row:1,n:4},side:{row:2,n:6}} };
const CFG=SHEETS[CHAR]||SHEETS.vesper;
const SPRITE=!!Q.get('sprite');            // 3D model is default; ?sprite=1 for the old billboard

// (localStorage) > the default — which is VESPER-V2, the user's own model.
// finn/mara/maren/pip are NPC-RECIPE builds (Walk_Loop, 0.46 u/s): in the picker for
// INSPECTION — as player models their walk would need ~10x to lock cadence (moon-skate).
const MODELS={ 'vesper-v2':'assets/characters/vesper/vesper-v2.glb', 'rogue':'assets/characters3d/rogue.glb',
  'finn':'assets/characters/finn/finn-v1.glb', 'mara':'assets/characters/mara/mara-v1.glb',
  'maren':'assets/characters/maren/maren-v1.glb', 'pip':'assets/characters/pip/pip-v1.glb' };

const MODEL_URL=Q.get('model')||MODELS[MODEL_KEY]||MODELS['vesper-v2'];
let MODEL_H=parseFloat(Q.get('ch'))||parseFloat(localStorage.getItem('eb_ch'))||1.45;  // live-tunable: [ ] keys or the M menu
let modelNatH=0, modelMinY=0;
function setCharH(h){MODEL_H=Math.round(Math.max(1.0,Math.min(2.2,h))*100)/100;localStorage.setItem('eb_ch',MODEL_H);
  if(model&&modelNatH){const k=MODEL_H/modelNatH;model.scale.setScalar(k);model.position.y=-modelMinY*k;}
  const el=document.getElementById('chval'); if(el)el.textContent=MODEL_H.toFixed(2);}
const el=document.getElementById('s'), hud=document.getElementById('h');
// live-refresh scenes (townwalk) ship meta.json with the export time — surface
// it in the HUD so a viewer always knows how fresh the geometry they see is
let BUNDLE_TS='', METASPAWN=null, METAYAW=null;
// ---- THE EPOCH -------------------------------------------------------------
// Every per-scene async load (meta, depth, cine art, zones, the GLB itself) is
// stamped with the epoch that started it. A transition bumps the epoch, so a
// response that arrives for a scene the player has already left is DROPPED and
// whatever it carries is disposed instead of being spliced into the live world.
// This is what replaces "the page died, so nothing can leak".
let EPOCH=0;
function loadMeta(ep){

  .then(j=>{if(!j||ep!==EPOCH)return; if(j.exported)BUNDLE_TS=' · master@'+j.exported.slice(11);

    if(j.spawn&&!URLSPAWN){METASPAWN=j.spawn; if(allMeshes.length){P.x=j.spawn[0];P.z=j.spawn[2];
      const f=walkFloors(P.x,P.z); P.y=f.length?f.reduce((a,b)=>Math.abs(a-j.spawn[1])<Math.abs(b-j.spawn[1])?a:b):j.spawn[1];

const R=new THREE.WebGLRenderer({antialias:true}); R.setSize(W,H,false); R.outputEncoding=THREE.sRGBEncoding; el.appendChild(R.domElement);
const scene=new THREE.Scene();
// single-framed scenes ship one stylized.png; a CINEMATIC bundle ships one backdrop
// per camera and sets the background itself, so never clobber a shot already applied
let BGTEX=null;                                   // owned by this scene; disposed on swap
function loadBackdrop(ep){

    if(ep!==EPOCH){t.dispose();return;}
    t.encoding=THREE.sRGBEncoding; BGTEX=t; if(!window.__cine)scene.background=t;},undefined,()=>{});
}

// HD-2D billboard character
const ch=new THREE.Group(); scene.add(ch);
const sheet=new THREE.TextureLoader().load('assets/characters3d/'+CHAR+'.png');

const mkMat=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.55,depthTest:false,depthWrite:false});

const occRay=new THREE.Raycaster();
let occT=0;
// ---- exact-pixel occlusion (depth-map mode) --------------------------------
// If the bundle ships depth.{png,json} — baked from the SAME render as the
// backdrop — a fullscreen quad writes gl_FragDepth per pixel and the GLB stops
// writing depth entirely. Image and occlusion cannot disagree: no strip-lists,
// no overhead/small-prop heuristics, no joined-mesh traps.
let DEPTH=null;
function applyDepthMode(){ if(!DEPTH||RT)return;
  for(const o of allMeshes){ const m=o.userData.hideMat; if(m) m.depthWrite=false;
    if(o.material&&o.material.colorWrite===false) o.material.depthWrite=false; } }
let DEPTH_META=null;
function applyDepthSpawn(){ if(URLSPAWN)return; const s=DEPTH_META&&DEPTH_META.spawn; if(!s)return;
  P.x=s[0]; P.z=s[2]; const f=walkFloors(s[0],s[2]); P.y=f.length?f.reduce((a,b)=>Math.abs(a-s[1])<Math.abs(b-s[1])?a:b):s[1];
  ch.position.set(P.x,P.y,P.z); }
// ONE quad for the lifetime of the page. A single-camera scene points it once; a
// cinematic town RE-POINTS it on every cut — swap the texture and the dN/dF pair and
// nothing else, because e10/e11/e14/e15 already track whatever camera is current
// (see loop()). That is the whole reason a camera cut can cost two texture uploads
// instead of a bundle reload. Textures are NOT disposed on swap: they are cached art.
// ACROSS A SCENE SWAP the quad keeps that policy and gets stronger: the geometry
// and the ShaderMaterial are a PAGE-level singleton (DEPTHQ) built once and never
// disposed, so renderer.info cannot drift by one quad per door however many doors
// are taken. Only the TEXTURE is per-scene, and the scene that loaded it disposes
// it. `DEPTH` stays the "are we in depth-map mode" answer everything else reads.
let DEPTHQ=null;

    applyDepthMode(); return DEPTH; }

    uniforms:{tD:{value:tex},e10:{value:0},e11:{value:0},e14:{value:0},e15:{value:0},dN:{value:near},dF:{value:far}},
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }',
    fragmentShader:[
      'varying vec2 vUv; uniform sampler2D tD; uniform float e10,e11,e14,e15,dN,dF;',
      'void main(){ vec3 c=texture2D(tD,vUv).rgb;',
      '  float d=dN+(dF-dN)*dot(floor(c*255.0+0.5),vec3(65536.0,256.0,1.0))/16777215.0;',
      '  float zv=-d, zc=e10*zv+e14, wc=e11*zv+e15;',
      '  gl_FragDepth=clamp((zc/wc)*0.5+0.5,0.0,1.0); }'].join('\n')});

  mat.depthTest=true; mat.depthFunc=THREE.AlwaysDepth;

// Returns a promise the transition holds the veil on: a scene whose depth map has
// not landed is a scene where the character can stand in front of a building she
// should be behind, and that is exactly the half-built frame rule (3) forbids.
function loadDepth(ep){
  if(RT) return Promise.resolve(null);
  return fetch(BASE+'depth.json?v='+Date.now()).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||ep!==EPOCH)return null;
    DEPTH_META=j; if(allMeshes.length) applyDepthSpawn();   // GLB won the race: re-spawn now

      new THREE.TextureLoader().load(BASE+'depth.png?v='+Date.now(),t=>{
        if(ep!==EPOCH){t.dispose();res(null);return;}
        DEPTHTEX=t; setDepth(t, j.near, j.far);

      },undefined,()=>res(null));

}
let DEPTHTEX=null;                                // the plain-depth scene's own map
// ===== CINEMATIC FIXED CAMERAS ==============================================
// A bundle that ships cine.json is a town played as a SEQUENCE OF SHOTS (the
// FF7/8/9 grammar) instead of one framed scene. The collision GLB is SHARED by
// every camera — a master-baked bundle carries the whole town's collision anyway —
// and each camera ships only its own background + depth pair, so a cut is a texture
// swap and a camera rebuild inside ONE document. No page load, no re-parse of 2108
// primitives, no BVH rebuild: the difference between a fade cut and a loading screen.
//
// EVERY NUMBER HERE COMES FROM cine.json, which tools/cine_bake.py wrote from
// townmap/dellhollow.cameras.solved.json — the same file it built the BLENDER camera
// from. There is no camera constant in this file, so the shipped image and the
// runtime projection cannot disagree (which is the same disease exact-pixel depth
// occlusion cured for geometry).
//
// ART CACHE POLICY (~5 MB of PNG per camera; eighteen cameras is ~100 MB and a
// player walks through six):
//   1. the ENTRY camera's pair is loaded before the scene is playable;
//   2. its graph-ADJACENT cameras are prefetched right after, in the background, so
//      every cut a player is one step from taking is already warm;
//   3. anything else is fetched ON THE CUT, with the fade covering the latency;
//   4. everything fetched is cached for the rest of the page (art is immutable per
//      load — the ?v= stamp is fixed once, below).
// Nothing is ever front-loaded.
// ART_V is PAGE-level on purpose: a scene swap must be able to re-enter a town it

// the way out — holding eighteen decoded PNGs per town across every door is the
// leak the whole disposal contract exists to prevent.
let CINE=null, CINECAM=null, CINE_READY=false, GLB_READY=false, CINEBOOTP=null;
const CINEART=new Map(), CINEPEND=new Map(), ART_V=Date.now();
const m2r=(p)=>[p[0], p[2], -p[1]];            // map/Blender [x,y,h] -> runtime [x,y,-z]
function loadCine(ep){
  if(RT) return Promise.resolve(null);
  return fetch(BASE+'cine.json?v='+Date.now()).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.cameras||!j.cameras.length||ep!==EPOCH) return null;

}
function texP(url){ return new Promise((res,rej)=>new THREE.TextureLoader().load(url,res,undefined,rej)); }

// take a shot. Returns a promise so a transition can hold the veil up until the new
// frame is actually ready — a cut must never show one camera's backdrop under
// another camera's depth map.
function cineGo(id){

  // would move the player and leave the old camera up — they would be standing

  // exists to prevent. (Seen for real: a page holding a cine.json baked before the
  // target shot existed.)

// bypassing the band entirely, and arrive 25 m away still under the gate camera and
// completely off-screen. That is the worst defect this grammar has: the player walks
// out of frame and the camera never follows.

// a torn-down AudioContext that music.js had to reconstruct through a
// sessionStorage playhead dance, a flash of load, and a full re-init of every
// module. This is the designated refinement: an IN-PLACE swap that has to EARN the
// old robustness rather than assume it. It pays in three places —
//   sceneDispose()  hands every GPU object back and resets every scene binding
//   EPOCH           drops any response that arrives for the scene we just left
//   'eb-scene'      ONE documented event, so no module has to guess
// — and it keeps the old path alive under ?reload=1 for the cases it gets wrong.
//

// is untouched and still does that job, which is exactly what keeps ?reload=1 (and
// any deep link) working. A handler is therefore always "do again what you did at
// load time, for this scene". Handlers must not throw and must not assume order.
//
//   music.js         Music.scene(detail.scene). Same track -> start() sees the
//                    voice already sounding and returns: the AudioContext, the
//                    node and the playhead are LITERALLY untouched, which is the
//                    whole point of the exercise. Different track -> the normal
//                    crossfade. No sessionStorage dance in either direction.
//   encounters.js    re-attach to the new world sources and regrace('scene'), so
//                    a doorway is never an ambush.
//   shop.js          registerPrompts() again: new scene key, new shop or none.
//   route_overlay.js drop the cached route data and rebuild for the new scene.
//   game_state.js    NOTHING. GS is page state and persists untouched across a
//                    door — no save, no load. (Under the old full reload GS was
//                    re-created from localStorage on every doorway, so a run with
//                    no save silently reset. In-place is strictly more correct.)
function sgAnnounce(prev, e){
  try{
    window.dispatchEvent(new CustomEvent('eb-scene',{detail:{
      scene:SCENE, prev, spawn:[P.x,P.y,P.z],
      edge:e&&e.id||null, kind:e&&e.kind||null, inPlace:true}}));
  }catch(err){ console.warn('eb-scene dispatch failed', err); }
}
// The swap proper. Everything here happens under a fully opaque veil.
function sgSwap(e,url){
  const prev=SCENE, t0=performance.now(), q=new URLSearchParams(url.slice(url.indexOf('?')+1));
  // (2) the URL is rewritten BEFORE the modules are told, so a handler that reads
  // location.search — shop.js and music.js both do — reads the truth.
  try{ history.replaceState(null,'',url); }catch(err){ /* file:// — params still drive us */ }
  UILOCK.lock('transition');        // freezes phys() and zeroes held keys, exactly
                                    // as losing the page's keydown state used to
  sceneDispose();                   // (bumps nothing; EPOCH is bumped by sceneLoad)
  const tDisp=performance.now();
  sceneParams(q);
  SGopened=true;                    // the veil is transitionTo's; sgOpen must not touch it
  return sceneLoad().then(r=>{
    UILOCK.unlock('transition');
    TRANSLOG.push({from:prev, to:SCENE, edge:e&&e.id||null, kind:'swap',
                   ms:Math.round(performance.now()-t0),
                   disposeMs:Math.round(tDisp-t0), loadMs:Math.round(performance.now()-tDisp)});
    sgAnnounce(prev,e);
    return r;
  }, err=>{ UILOCK.unlock('transition'); throw err; });
}
function transitionTo(e){
  if(SGbusy) return null;
  SGbusy=true; SGnear=null; sgPrompt(null);
  const ms=sgDef('fadeMs',350), url=sgUrl(e), local=(e.to===SCENE);
  sgFade(1,ms).then(()=>{
    // HOLD THE VEIL until the new shot is actually ready. applyCam may have to
    // fetch a camera's art; fading in early would show the old backdrop under the
    // new depth map, which reads as the character vanishing into a wall. The
    // cross-scene swap holds it for the same reason, over a bigger job.
    if(local) return Promise.resolve(sgHandoff(e))
      .then(()=>sgFade(0,ms)).then(()=>{SGbusy=false;});
    if(RELOAD){ location.assign(url); return; }   // (4) the original path, intact
    return sgSwap(e,url).then(()=>sgFade(0,ms)).then(()=>{SGbusy=false;},
      err=>{ console.error('[transition] in-place swap failed; falling back to a full load', err);
             location.assign(url); });
  });
  return {url, local};
}
// same-scene handoff: no reload. This is the camera layer's mechanism.
function sgHandoff(e){
  // Counted SEPARATELY so a playtest can tell an authored cut from the safety net firing:
  // a rising corrections count means routes exist that no seam covers.
  if(e.correction) SGcorrections++; else SGcuts++;
  sgPlace(e.spawn);
  if(e.spawnYaw!=null&&window.ORBIT) window.ORBIT.yaw=e.spawnYaw;
  for(const x of SGE) x.armed=null;          // re-decide suppression at the new spot
  return applyCam(e.cam);                    // a promise when a shot must be fetched
}
// THE CAMERA SEAM. `cam` is whatever the scene-graph generator put in the edge; for
// Dellhollow it is {key:'<camera id>'} and everything numeric about that camera comes
// from the bundle's own cine.json (which tools/cine_bake.py wrote from the same solved
// file it built the Blender camera from). Returns a promise so transitionTo can hold
// the fade until the shot is on screen. Legacy scenes pass nothing and are untouched.
function applyCam(cam){
  if(!cam) return null;
  window.__sgCam=cam;
  if(cam.key&&CINE) return cineGo(cam.key);
  return null;
}
// place the player at an arrival point: snap to the walk network if there is one
// under it (the graph's heights come from the same meshes, so this is a 1-2cm
// correction), else to any floor, else trust the point.
function sgPlace(p){
  let ys=(walkRef.length?walkFloors(p[0],p[2]):[]);
  if(!ys.length) ys=floors(p[0],p[2]);
  P.x=p[0]; P.z=p[2];
  P.y=ys.length?ys.reduce((a,b)=>Math.abs(a-p[1])<Math.abs(b-p[1])?a:b):p[1];
  AIR=false; jvy=0; CURF=null;
  lastSafe={x:P.x,y:P.y,z:P.z};
  ch.position.set(P.x,P.y,P.z);
  return {...P};
}
// --- headless test surface ---------------------------------------------------
Object.assign(window.SIM,{
  // authored interaction pad lookup by mesh-name (regex or exact, case-insens.)
  // — e.g. SIM.pad('walk_pad_counter') in a shop interior. Granted to the
  // economy agent so shop.js carries zero coordinates, ever.
  pad(n){ const rx=n instanceof RegExp?n:new RegExp('^'+n+'$','i');
    const o=allMeshes.find(m=>rx.test(m.name)); if(!o) return null;
    const b=new THREE.Box3().setFromObject(o), c=b.getCenter(new THREE.Vector3());
    return {name:o.name, center:c.toArray(), min:b.min.toArray(), max:b.max.toArray()}; },
  // every edge out of this scene, with live distances and arm state
  edges(){ return SGE.map((e,i)=>{ const h=sgHit(e);
    return {i, id:e.id, kind:e.kind, to:e.to, label:e.label, at:e.at, r:e.r,
            dist:+h.d.toFixed(2), dy:+h.dy.toFixed(2), inRange:h.in, armed:e.armed,
            spawn:e.spawn, camFrom:e.camFrom||null, cam:e.cam?e.cam.key:null,
            auto:!!e.auto, band:e.band||null,
            live:!(e.camFrom&&CINECAM&&e.camFrom!==CINECAM.id)}; }); },
  // ---- cinematic cameras: the whole state a test needs to judge a cut ----------
  cine(){ if(!CINE) return null;
    return {shot:CINECAM?CINECAM.id:null, name:CINECAM?CINECAM.name:null,
      shots:CINE.cameras.map(c=>c.id), cached:[...CINEART.keys()], pending:[...CINEPEND.keys()],
      cuts:SGcuts, corrections:SGcorrections, busy:SGbusy,
      regions:SGREG?SGREG.length:0, corrTicks:SGcorrTicks, corrTarget:SGcorrLast,
      depth:DEPTH?{near:DEPTH.near,far:DEPTH.far}:null,
      cam:cam?{pos:cam.position.toArray().map(v=>+v.toFixed(2)),fov:cam.fov,
               near:cam.near,far:cam.far}:null,
      baked:CINECAM?{pos:CINECAM.pos,aim:CINECAM.aim,fov:CINECAM.fov,
                     visibleFrac:CINECAM.visibleFrac,spawn:CINECAM.spawn}:null}; },
  // jump straight to a shot without walking there (framing review, art checks)
  shot(id){ return cineGo(id).then(c=>c?{shot:c.id,name:c.name}:{error:'no shot '+id}); },
  // take an edge as if the player pressed its key. {navigate:false} returns the
  // URL without leaving the page (so a test can assert the target and spawn).
  go(i,opt){ const e=SGE[i]; if(!e) return {error:'no edge '+i};
    if(opt&&opt.navigate===false) return {id:e.id, url:sgUrl(e), local:e.to===SCENE};
    const r=transitionTo(e); return r?{id:e.id, ...r}:{error:'busy'}; },
  // what the player can see right now
  prompt(){ return SGnear?{id:SGnear.id,label:SGnear.label,key:SGnear.key||sgDef('key','e'),
    text:SGbanner?SGbanner.textContent:null, visible:!!(SGbanner&&SGbanner.style.opacity==='1')}:null; },
  graph(){ return SG?{version:SG.version,generated:SG.generated,nodes:Object.keys(SG.nodes||{}),
    defaults:SGD, scene:SCENE, edges:SGE.length}:null; },
  place:sgPlace, arrival(){ return URLSPAWN; },
  // TEST-ONLY: inject an edge this scene did not ship with. It exists so the
  // scene-internal handoff (to === from, the camera layer's mechanism) can be
  // exercised before any such edge is authored in the generator — and so a future
  // camera edge can be prototyped live before it goes into the map pipeline.
  addEdge(e){ SGE.push(Object.assign({r:sgDef('doorRadius',1.8), key:sgDef('key','e'),
    kind:'test', label:'TEST', from:SCENE, id:'test'+SGE.length}, e, {armed:null}));
    return SGE.length-1; },
  // ---- the in-place swap's own test surface ---------------------------------
  scene(){ return SCENE; },
  // renderer.info is the ONLY honest answer to "did the swap leak". A count that
  // does not come back to where it started after a round trip means something this
  // scene uploaded was dropped without being disposed, and three.js cannot know.
  gpu(){ const m=R.info.memory, p=R.info.programs;
    return {geometries:m.geometries, textures:m.textures, programs:p?p.length:null,
            meshes:allMeshes.length, collide:collide.length, walk:walkRef.length,
            cineArt:CINEART.size, epoch:EPOCH, sceneMats:SCENEMATS.size}; },
  transitions(){ return {log:TRANSLOG.slice(-40), n:TRANSLOG.length,
                         busy:SGbusy, reloadPath:RELOAD, scene:SCENE, epoch:EPOCH}; },
  // Take the edge that leads to `to` (optionally the one whose id contains `via`)
  // and resolve when the transition has fully settled. This is SIM.go() with a
  // promise: a scripted gauntlet cannot poll SGbusy without racing the fade.
  door(to,via){
    const i=SGE.findIndex(e=>e.to===to&&e.from===SCENE&&(!via||String(e.id).indexOf(via)>=0));
    if(i<0) return Promise.resolve({error:'no edge to '+to+' from '+SCENE,
                                    have:SGE.filter(e=>e.to!==SCENE).map(e=>e.id)});
    const t0=performance.now(), from=SCENE, e=SGE[i];
    const r=transitionTo(e);
    if(!r) return Promise.resolve({error:'busy'});
    return new Promise(res=>{ let n=0;
      const w=()=>{ if(!SGbusy||++n>1200) return res({from, to:SCENE, id:e.id,
        ms:Math.round(performance.now()-t0), url:r.url, timedOut:SGbusy});
        setTimeout(w,25); };
      setTimeout(w,25); });
  },
});
// ---- BOOT ------------------------------------------------------------------
// The first scene load is the SAME call every subsequent door makes. That is the
// property that keeps the in-place path honest: there is no "first time" branch to
// rot, and a defect in the swap shows up on a plain page load too.
let TRANSLOG=[];
sceneLoad().then(r=>{ if(r) TRANSLOG.push({scene:r.scene, kind:'boot', ms:Math.round(performance.now())}); });
</script>
