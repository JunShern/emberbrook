<meta charset="utf-8"><title>FF-hybrid scene player</title>
<style>html,body{margin:0;background:#000}#s{position:relative;width:100vw;height:56.25vw;max-height:100vh}
canvas{position:absolute;inset:0;width:100%;height:100%}#h{position:fixed;top:6px;left:8px;color:#e7ddd0;font:12px monospace;z-index:2;text-shadow:0 1px 2px #000}</style>
<div id="h">loading…</div><div id="s"></div>
<script src="lib/three.min.js"></script><script src="lib/GLTFLoader.js"></script>
<script>
// Generalized FF-hybrid runtime: loads any migrated scene bundle
//   ?scene=<key>  (public/assets/scenes/<key>/{stylized.png,scene.glb})   default dellhollow3d
//   ?char=<key>   (HD-2D sheet in public/assets/characters3d/<key>.png)   default vesper
// Renders: stylized backdrop + invisible depth geometry (occlusion) + depth-occluded
// billboard character with raycast collision. This is the reference impl for render3d.js.
const Q=new URLSearchParams(location.search);
const SCENE=Q.get('scene')||'dellhollow3d', CHAR=Q.get('char')||'vesper', RT=Q.get('rt')||SCENE==='townwalk';  // rt: real-time explore mode (townwalk defaults in)
const BASE='assets/scenes/'+SCENE+'/', W=1344,H=768;
// per-character sheet layout (cols,rows,dirs); extend as cast is added
const SHEETS={ vesper:{cols:6,rows:3,down:{row:0,n:4},up:{row:1,n:4},side:{row:2,n:6}} };
const CFG=SHEETS[CHAR]||SHEETS.vesper;
const SPRITE=!!Q.get('sprite');            // 3D model is default; ?sprite=1 for the old billboard
const MODEL_URL='assets/characters3d/rogue.glb';   // KayKit hooded rogue (rigged + animated)
const el=document.getElementById('s'), hud=document.getElementById('h');
const R=new THREE.WebGLRenderer({antialias:true}); R.setSize(W,H,false); R.outputEncoding=THREE.sRGBEncoding; el.appendChild(R.domElement);
const scene=new THREE.Scene();
new THREE.TextureLoader().load(BASE+'stylized.png?v='+Date.now(),t=>{t.encoding=THREE.sRGBEncoding;scene.background=t;});
scene.add(new THREE.AmbientLight(0xffffff,.95)); const dl=new THREE.DirectionalLight(0xffd9a8,1.3);dl.position.set(6,10,4);scene.add(dl);
// HD-2D billboard character
const ch=new THREE.Group(); scene.add(ch);
const sheet=new THREE.TextureLoader().load('assets/characters3d/'+CHAR+'.png');
sheet.wrapS=sheet.wrapT=THREE.RepeatWrapping; sheet.repeat.set(1/CFG.cols,1/CFG.rows); sheet.encoding=THREE.sRGBEncoding;
const spr=new THREE.Mesh(new THREE.PlaneGeometry(2.05,2.05),new THREE.MeshBasicMaterial({map:sheet,alphaTest:.5,side:THREE.DoubleSide}));
spr.position.y=1.03; if(SPRITE) ch.add(spr);
// 3D character: KayKit rogue, scaled to the 1.7u contract, idle/walk clips
let model=null,mixer=null,actIdle=null,actWalk=null,actJump=null,actCur=null;const clock=new THREE.Clock();
if(!SPRITE) new THREE.GLTFLoader().load(MODEL_URL,g=>{
  model=g.scene;
  const bb=new THREE.Box3().setFromObject(model), sz=new THREE.Vector3(); bb.getSize(sz);
  const k=1.7/sz.y; model.scale.setScalar(k);
  model.position.y=-bb.min.y*k;
  ch.add(model);
  window.CHAR3D={get model(){return model},get cur(){return actCur&&(actCur.getClip?actCur.getClip().name:null)}};
  mixer=new THREE.AnimationMixer(model);
  const clips=g.animations||[];
  const pick=re=>clips.find(c=>re.test(c.name));
  actIdle=mixer.clipAction(pick(/^Idle$/i)||pick(/idle/i)||clips[0]);
  actWalk=mixer.clipAction(pick(/^Walking_A$/i)||pick(/walk/i)||pick(/run/i)||clips[0]);
  window.actJump=pick(/^Jump_Full_Short$/i)||pick(/^Jump$/i)||pick(/jump/i); actJump=actJump?mixer.clipAction(actJump):null;
  actIdle.play(); actCur=actIdle;
});
function setAct(a){ if(!mixer||a===actCur) return; a.reset().fadeIn(0.15).play(); if(actCur)actCur.fadeOut(0.15); actCur=a; }
const DIRS={down:{row:CFG.down.row,n:CFG.down.n,m:false},up:{row:CFG.up.row,n:CFG.up.n,m:false},
  left:{row:CFG.side.row,n:CFG.side.n,m:false},right:{row:CFG.side.row,n:CFG.side.n,m:true}};
let sdir='down',stick=0; function setF(d,i){const o=DIRS[d];sheet.offset.set((i%o.n)/CFG.cols,1-(o.row+1)/CFG.rows);spr.scale.x=o.m?-1:1;} setF('down',0);
// world + collision
let cam, collide=[], allMeshes=[], DEBUG=false, P={x:0,y:2,z:0}, RAD=.42, STEP_UP=.55, STEP_DN=.8, SPD=.075;
const keys={}; addEventListener('keydown',e=>{if(e.key===' ')e.preventDefault();keys[e.key.toLowerCase()]=1}); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let jumpY=0, jvy=0;   // visual jump arc over the walked ground height
// G = toggle debug overlay (green = walkable surfaces, blue wireframe = collision/occlusion meshes)
//     overlaid ON the stylized art so you can judge geometry-vs-art alignment.
// 2 = (while debug on) blank the art to inspect the mesh alone.
let BLANK=false;
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='g'){ DEBUG=!DEBUG; if(!DEBUG)BLANK=false; applyDebug(); }
  if(k==='2'&&DEBUG){ BLANK=!BLANK; applyDebug(); }
});
const ray=new THREE.Raycaster(), DOWN=new THREE.Vector3(0,-1,0);
const wn=h=>h.face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(h.object.matrixWorld)).normalize();
const isBar=o=>{let p=o;while(p){if(/^bar_/i.test(p.name))return true;p=p.parent;}return false;};
function ground(x,z,fy){ray.set(new THREE.Vector3(x,fy+STEP_UP+.1,z),DOWN);ray.far=STEP_UP+STEP_DN+.2;for(const h of ray.intersectObjects(collide,true))if(wn(h).y>.5&&!isBar(h.object))return h.point.y;return null;}
function floors(x,z){ray.set(new THREE.Vector3(x,40,z),DOWN);ray.far=80;return ray.intersectObjects(collide,true).filter(h=>wn(h).y>.5&&!isBar(h.object)).map(h=>h.point.y);}
function wall(x,z,dx,dz,fy){const l=Math.hypot(dx,dz)||1,d=new THREE.Vector3(dx/l,0,dz/l),pp=new THREE.Vector3(-d.z,0,d.x);
 // a hit at ONE height is usually the thin side of a tread/pad/ribbon (collide is
 // walk_-only, so real walls are rare); demand vertical extent: 2+ of 3 heights blocked
 // a real wall spans LOW and HIGH; stacked thin treads (hairpin overhangs) graze
 // only adjacent heights and must not block
 const B=[0,0,0], HS=[STEP_UP+.2,.95,1.5];
 for(let hi=0;hi<3;hi++){
  for(const o of[0,RAD*.75,-RAD*.75]){ray.set(new THREE.Vector3(x+pp.x*o,fy+HS[hi],z+pp.z*o),d);ray.far=RAD+l+.02;
   let bl=false;
   for(const h of ray.intersectObjects(collide,true))if(Math.abs(wn(h).y)<.6){bl=true;break;}
   if(bl){B[hi]=1;break;}}
 }
 return !!(B[0]&&B[2]);}
function rayStep(dx,dz){for(const[mx,mz]of[[dx,dz],[dx,0],[0,dz]]){if(!mx&&!mz)continue;if(wall(P.x,P.z,mx,mz,P.y))continue;const g=ground(P.x+mx,P.z+mz,P.y);if(g==null)continue;P.x+=mx;P.z+=mz;P.y=g;return;}}
// ===== NETWORK COLLISION (?net=<town>) ========================================
// The town map's walk network IS the navmesh: movement = containment in the
// designed segments/discs/pads with interpolated heights. Art geometry becomes
// pure visuals — detail passes can never break walkability. Ladders traverse.
let NET=null;
async function loadNet(town){
  const m=await fetch('townmap/'+town+'.map.json?v='+Date.now()).then(r=>r.json());
  const LMn={}; for(const l of m.landmarks) LMn[l.id]=l;
  const T=p=>({x:p[0], y:p[2], z:-p[1]});
  const segs=[], discs=[], pads=[];
  const WIDTH={road:2.6, deck:2.6, path:2.2, stairs:2.4, bridge:2.0, ladder:1.2};
  const STEEP={stairs:1, ladder:1};
  const flatR=l=>l.class==='area'?(l.extent||3):1.5;   // disc rim or pad half-size
  function trim(pt, toward, dist){
    const vx=toward.x-pt.x, vz=toward.z-pt.z, L=Math.hypot(vx,vz);
    if(L<=dist+0.4) return pt;
    return {x:pt.x+vx/L*dist, y:pt.y, z:pt.z+vz/L*dist};  // keep z: flight starts at the flat's level, AT its edge
  }
  for(const e of m.edges){
    if(!(e.type in WIDTH)) continue;
    let pts=[LMn[e.from].pos, ...(e.waypoints||[]), LMn[e.to].pos].map(T);
    if(STEEP[e.type]){
      pts[0]=trim(pts[0], pts[1], flatR(LMn[e.from]));
      pts[pts.length-1]=trim(pts[pts.length-1], pts[pts.length-2], flatR(LMn[e.to]));
      // landings: flat mini-pads at every steep vertex (mirrors the geometry's
      // stair landings) — smooths corner-cutting across z-kinked elbows
      for(const q of pts) pads.push({x:q.x, z:q.z, y:q.y, h:1.1});
    }
    for(let i=0;i<pts.length-1;i++) segs.push({a:pts[i], b:pts[i+1], w:WIDTH[e.type]});
  }
  for(const l of m.landmarks){
    const t=T(l.pos);
    if(l.class==='area') discs.push({x:t.x,z:t.z,y:t.y,r:(l.extent||3)});
    else if(l.class!=='dressing') pads.push({x:t.x,z:t.z,y:t.y,h:1.5});
  }
  NET={segs,discs,pads};
  return m;
}
// feature-tracked movement: ride the CURRENT feature's height authoritatively
// (steep ladders fine — same feature can change y fast); switch features only
// when the new point is contained AND its height is near the current one.
let CURF=null;
function featAt(x,z){ // all features containing (x,z), with their y there
  const out=[];
  for(const f of NET.segs){
    const vx=f.b.x-f.a.x, vz=f.b.z-f.a.z, L2=vx*vx+vz*vz||1e-9;
    let t=((x-f.a.x)*vx+(z-f.a.z)*vz)/L2; t=Math.max(0,Math.min(1,t));
    const px=f.a.x+vx*t, pz=f.a.z+vz*t;
    if(Math.hypot(x-px,z-pz)<=f.w/2) out.push({f, y:f.a.y+(f.b.y-f.a.y)*t});
  }
  for(const c of NET.discs) if(Math.hypot(x-c.x,z-c.z)<=c.r) out.push({f:c, y:c.y});
  for(const c of NET.pads) if(Math.abs(x-c.x)<=c.h&&Math.abs(z-c.z)<=c.h) out.push({f:c, y:c.y});
  return out;
}
function netY(x,z,fy){ // read-only query (tests/debug): nearest-level view
  let best=null;
  for(const c of featAt(x,z)){const d=Math.abs(c.y-fy); if(d<=2.0&&(!best||d<best.d)) best=c;}
  return best?best.y:null;
}
function netMoveTo(x,z){
  const cands=featAt(x,z);
  if(!cands.length) return null;
  // stay on the current feature if it still contains the point
  if(CURF){ const same=cands.find(c=>c.f===CURF); if(same) return same; }
  // else switch to the feature nearest our current height (tight gate: 1.0)
  let best=null;
  for(const c of cands){const d=Math.abs(c.y-P.y); if(d<=1.0&&(!best||d<best.d)) best=c;}
  return best;
}
function netStep(dx,dz){
  for(const ang of [0, 0.5, -0.5, 1.0, -1.0]){
    const c=Math.cos(ang), si=Math.sin(ang);
    const mx=(dx*c-dz*si), mz=(dx*si+dz*c);
    const hit=netMoveTo(P.x+mx,P.z+mz);
    if(hit){P.x+=mx;P.z+=mz;P.y=hit.y;CURF=hit.f;return;}
  }
}
function step(dx,dz){return NET?netStep(dx,dz):rayStep(dx,dz);}
const NETTOWN=Q.get('net');
if(NETTOWN) loadNet(NETTOWN).then(m=>{
  const gate=m.landmarks.find(l=>l.class==='portal'&&l.mapVisible)||m.landmarks[0];
  P.x=gate.pos[0]; P.z=-gate.pos[1]; P.y=gate.pos[2]; CURF=null;
});
new THREE.GLTFLoader().load(BASE+'scene.glb?v='+Date.now(),g=>{
  scene.add(g.scene); cam=g.cameras&&g.cameras[0];
  if(!cam){ cam=new THREE.OrthographicCamera(-20,20,11.25,-11.25,.1,200); cam.position.set(22,24,22); cam.lookAt(0,1,0); }
  g.scene.updateMatrixWorld(true);
  // occlusion depth uses ALL geometry; collision floors/walls use ONLY walk_ surfaces
  // (props/roofs/awnings must not register as false floors — the perch bug)
  if(RT){ scene.background=new THREE.Color(0x8a7a6a);
    scene.add(new THREE.HemisphereLight(0xffe8c8, 0x4a4038, 0.75)); }
  g.scene.traverse(o=>{if(o.isMesh){
    const isWalk=/^walk/i.test(o.name);   // bar_ rails are visual-only: they choked lanes as colliders
    o.userData.isWalk=isWalk;
    o.userData.hideMat=new THREE.MeshBasicMaterial({colorWrite:false});          // invisible depth (play mode)
    o.userData.dbgMat=isWalk
      ? new THREE.MeshBasicMaterial({color:0x2fff6a,transparent:true,opacity:.55,depthWrite:false,side:THREE.DoubleSide}) // walkable = green fill
      : new THREE.MeshBasicMaterial({color:0x5ab4ff,wireframe:true,transparent:true,opacity:.55});                        // objects  = blue wireframe
    if(/^bar_/i.test(o.name)){ o.material=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false}); collide.push(o); return; } // barrier: wall-check only, never drawn, never occludes
    if(!RT){ o.material=o.userData.hideMat; o.renderOrder=-1; }   // rt mode keeps real materials visible
    allMeshes.push(o); if(isWalk)collide.push(o);
  }});
  // spawn: at the door pad when the scene has one (interiors: geometric center
  // is usually BEHIND the counter); else scan for floor nearest the center
  const doorPad = collide.find(o=>/walk_pad_door/i.test(o.name));
  if(doorPad){ const c=new THREE.Vector3(); new THREE.Box3().setFromObject(doorPad).getCenter(c);
    const f=floors(c.x,c.z); if(f.length){ P.x=c.x; P.z=c.z; P.y=Math.max(...f); } }
  // fallback: scan the collision bounds for a walkable floor nearest the center
  const bb=new THREE.Box3(); for(const m of collide) bb.expandByObject(m);
  const cx=(bb.min.x+bb.max.x)/2, cz=(bb.min.z+bb.max.z)/2;
  const stepX=Math.max(1.5,(bb.max.x-bb.min.x)/64), stepZ=Math.max(1.5,(bb.max.z-bb.min.z)/64);
  let best=null;
  for(let x=bb.min.x;x<=bb.max.x;x+=stepX)for(let z=bb.min.z;z<=bb.max.z;z+=stepZ){
    const f=floors(x,z);
    if(f.length){const y=Math.max(...f); const d=Math.abs(x-cx)+Math.abs(z-cz); if(!best||d<best.d)best={x,z,y,d};}}
  if(best && !doorPad){P.x=best.x;P.z=best.z;P.y=best.y;}
  hud.textContent=`${SCENE} · ${CHAR} · WASD`; loop();
});
// debug overlay: swap every mesh between invisible-depth and its debug material; dim the backdrop
let dbgLegend=null, bgSaved=null;
function applyDebug(){
  for(const o of allMeshes){
    o.material = DEBUG ? o.userData.dbgMat : o.userData.hideMat;
    o.renderOrder = DEBUG ? (o.userData.isWalk?2:1) : -1;   // walk floors on top of object wireframes
  }
  // keep the stylized backdrop visible so geometry-vs-art ALIGNMENT is directly checkable;
  // '2' blanks it for mesh-only inspection
  if(DEBUG && BLANK){ if(scene.background){ bgSaved=scene.background; scene.background=null; el.style.background='#0c1016'; } }
  else { if(bgSaved){ scene.background=bgSaved; bgSaved=null; el.style.background='#000'; } }
  if(!dbgLegend){
    dbgLegend=document.createElement('div');
    dbgLegend.style.cssText='position:fixed;top:6px;right:8px;z-index:3;font:12px monospace;color:#e7ddd0;background:#000a;padding:8px 10px;border-radius:6px;line-height:1.7';
    dbgLegend.innerHTML='<b>DEBUG (G to hide)</b><br><span style="color:#2fff6a">■</span> walkable surface<br><span style="color:#5ab4ff">▦</span> object mesh (occlusion)<br>character shows its true 3D pos';
    document.body.appendChild(dbgLegend);
  }
  dbgLegend.style.display = DEBUG ? 'block' : 'none';
}
function fwd(){const f=new THREE.Vector3();cam.getWorldDirection(f);f.y=0;f.normalize();return{f,r:new THREE.Vector3(-f.z,0,f.x)};}
function loop(){requestAnimationFrame(loop);const{f,r}=fwd();let dx=0,dz=0;
 if(keys.w||keys.arrowup){dx+=f.x;dz+=f.z}if(keys.s||keys.arrowdown){dx-=f.x;dz-=f.z}if(keys.d||keys.arrowright){dx+=r.x;dz+=r.z}if(keys.a||keys.arrowleft){dx-=r.x;dz-=r.z}
 const l=Math.hypot(dx,dz);if(l)step(dx/l*SPD,dz/l*SPD);
 if(keys[' ']&&jumpY===0&&jvy===0){ jvy=5.4; if(!SPRITE&&actJump){ setAct(actJump); } }
 if(jvy!==0||jumpY>0){ jumpY+=jvy/60; jvy-=14.5/60; if(jumpY<=0){ jumpY=0; jvy=0; if(!SPRITE)setAct(l?actWalk:actIdle); } }
 ch.position.set(P.x,P.y+jumpY,P.z);
 if(SPRITE){ if(l){const aF=dx*f.x+dz*f.z,aR=dx*r.x+dz*r.z;sdir=Math.abs(aF)>=Math.abs(aR)?(aF>0?'up':'down'):(aR>0?'right':'left');stick=(stick+1)%(DIRS[sdir].n*5);setF(sdir,Math.floor(stick/5));}else setF(sdir,0);}
 else { if(mixer)mixer.update(clock.getDelta());
   if(jumpY>0){ if(model&&l) ch.rotation.y=Math.atan2(dx,dz); }
   else if(l){ setAct(actWalk); if(model) ch.rotation.y=Math.atan2(dx,dz); }
   else setAct(actIdle); }
 if(RT){ if(!window._rtCam){ window._rtCam=new THREE.PerspectiveCamera(42, W/H, 0.1, 400);
     window.ORBIT={yaw:Math.PI*0.25, pitch:0.62, dist:16, panX:0, panY:0, panZ:0};
     const cv=R.domElement; let drag=null;
     cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};if(drag.pan)e.preventDefault();});
     addEventListener('mouseup',()=>drag=null);
     addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
       if(drag.pan){const c=Math.cos(ORBIT.yaw),si=Math.sin(ORBIT.yaw),k=ORBIT.dist*0.0016;
         ORBIT.panX+=(-dx*c)*k+(dy*si)*k; ORBIT.panZ+=(dx*si)*k+(dy*c)*k;}
       else{ORBIT.yaw-=dx*0.008; ORBIT.pitch=Math.max(0.12,Math.min(1.35,ORBIT.pitch+dy*0.006));}});
     cv.addEventListener('wheel',e=>{e.preventDefault();ORBIT.dist=Math.max(4,Math.min(70,ORBIT.dist*(1+Math.sign(e.deltaY)*0.1)));},{passive:false});
     cv.addEventListener('contextmenu',e=>e.preventDefault());
   }
   cam=window._rtCam;
   const O=window.ORBIT, tx=P.x+O.panX, ty=P.y+1+O.panY, tz=P.z+O.panZ;
   cam.position.set(tx+Math.cos(O.yaw)*Math.cos(O.pitch)*O.dist,
                    ty+Math.sin(O.pitch)*O.dist,
                    tz+Math.sin(O.yaw)*Math.cos(O.pitch)*O.dist);
   cam.lookAt(tx,ty,tz); }
 if(SPRITE) ch.rotation.y=Math.atan2(cam.position.x-P.x,cam.position.z-P.z);
 R.render(scene,cam);
 hud.textContent=`${SCENE} · ${CHAR} · pos(${P.x.toFixed(1)},${P.y.toFixed(1)},${P.z.toFixed(1)})${RT?' · drag:orbit wheel:zoom shift-drag:pan':''} · G:debug${DEBUG?' ON':''}`;}
window.SIM={pos(){return{...P}},floors,netY:(x,z,fy)=>NET?netY(x,z,fy):null,tpY(x,z,ty){const ys=floors(x,z);if(ys.length){let b=ys[0];for(const y of ys)if(Math.abs(y-ty)<Math.abs(b-ty))b=y;P.x=x;P.z=z;P.y=b}ch.position.set(P.x,P.y,P.z);R.render(scene,cam);return{...P}}};
</script>
