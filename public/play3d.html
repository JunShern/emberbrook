<script src="lib/three.min.js"></script><script src="game/scenes.js"></script>
<script>
// Generalized FF-hybrid runtime: loads any migrated scene bundle
//   ?scene=<key>  (public/assets/scenes/<key>/{stylized.png,scene.glb})   default dellhollow3d
//   ?char=<key>   (HD-2D sheet in public/assets/characters3d/<key>.png)   default vesper
// Renders: stylized backdrop + invisible depth geometry (occlusion) + depth-occluded
// billboard character with raycast collision. This is the reference impl for render3d.js.
// ===== PAGE PARAMETERS vs SCENE PARAMETERS ==================================
// The distinction below is the whole basis of the in-place scene swap. A PAGE
// parameter is a property of this browser tab and outlives every transition (the
// character, the renderer, the model choice). A SCENE parameter is a property of
// THE BUNDLE CURRENTLY LOADED and is rewritten wholesale by sceneParams() every
// time a door is taken. Anything that reads a scene parameter therefore has to
// read the live binding, never a captured copy — which is why they are `let`.
const Q0=new URLSearchParams(location.search);
const CHAR=Q0.get('char')||'vesper';
// FALLBACK SWITCH. ?reload=1 restores the original state-free full page load for
// every transition this tab takes (it is propagated through sgUrl, so the whole
// journey stays on the old path, not just the first door). It is the escape hatch
// for anything the in-place swap gets wrong, and both paths are kept working.
const RELOAD=Q0.get('reload')==='1';
let Q=Q0, SCENE, RT, WALKLOCK, URLSPAWN, URLYAW, BASE, OWCAM;
function sceneParams(q){
  Q=q;
  SCENE=q.get('scene')||'del-cine';   // bare visit = the real game (legacy proto default caused a 'loads then nothing' report)
  // rt: real-time explore mode (townwalk + emb-townwalk default in; ow-* since
  // PT-20260803-016/017/018). THE OVERWORLD USED TO BE MISSING FROM THIS LINE while
  // sitting in OWCAM's regex eighteen lines below, and the two say the same thing
  // about the same scene: ow-* is a real-time explore scene. The follow camera only
  // exists inside `if(RT)` (see frame()), so any entry into ow-valley on a page that
  // booted without ?rt=1 kept the region GLB's baked overview camera 200 m up: a
  // tabletop DIORAMA of the whole valley, no character on screen, nothing pickable.
  // The playtest agent called it "the valley map screen" and filed three blockers in
  // one run, and it was every checkpoint drop-in, every dev jump and every QA link
  // into the overworld. Measured: 0/25 screen points hit any surface without rt,
  // 25/25 with it. Two regexes that mean one thing must not disagree.
  RT=q.get('rt')||/(^|-)townwalk$/.test(SCENE)||/^ow-/.test(SCENE);
  // WALKLOCK (user ruling 2026-07-31): in the routed town scenes the walk network is
  // LAW — walking never drops off an edge onto a lower floor (the old "anything you
  // can climb onto you can get down from" ledge rule made the player fall off routes
  // constantly). Jumping (Space) remains the deliberate way down. ?walklock=0 reverts.
  WALKLOCK=/^(del-|emb-|townwalk)/.test(SCENE)&&q.get('walklock')!=='0'&&(function(){try{return localStorage.getItem('eb-walklock')!=='0';}catch(e){return true;}})();
  // ---- ARRIVAL OVERRIDE (the scene-graph transition layer, bottom of this file) ----
  // ?sx&sy&sz place the player explicitly: this is how one scene hands off to the
  // next. It OUTRANKS every other spawn source (meta.json pin, baked depth spawn,
  // door pad, centre scan) because it is an act of navigation, not a scene default.
  // ?yaw pins the real-time follow camera's start heading; ?fade=1 opens black.
  URLSPAWN = (q.has('sx')&&q.has('sz'))
    ? [parseFloat(q.get('sx')), parseFloat(q.get('sy')||'0'), parseFloat(q.get('sz'))] : null;
  URLYAW = q.has('yaw') ? parseFloat(q.get('yaw')) : null;
  BASE='assets/scenes/'+SCENE+'/';

  // player's walking direction (~100 ft equivalent at miniature scale). Applies to
  // ow-* scenes; drag/wheel still work, the yaw eases back to heading while moving.
  OWCAM = /^ow-/.test(SCENE);
  owCamRead(q);
  FLOORY = wbFloor(SCENE);
}
// ---- THE OVERWORLD BOOM: ELEVATION AND AIM ARE TWO NUMBERS ------------------
// (2026-08-04.  ?owpitch= / ?owtilt= override either, in radians, for A/B.)
// DISTANCE IS FIXED BY USER RULING (boom 40 — "a wide enough field of view to
// appreciate the surroundings… where the landscape is leading them"); pitch is
// explicitly OPEN, and so is how much horizon is in the shot.
//
// THE GEOMETRY THAT DECIDES THIS, and it is not a taste call.  The follow camera
// is a 42 deg VERTICAL fov, so the top edge of the frame sits 21 deg above the
// camera's own axis.  While the camera looks down at OWPITCH, the top of the
// frame is at (OWPITCH - 21 deg) BELOW the horizontal — so at the shipped 0.61
// rad (35 deg) everything above the horizon, sky dome and all three ridge rings
// included, is 14 deg off the top of the screen.  Measured: zero sky pixels on
// all four ow cameras.  NOTHING above the horizon can appear at ANY aim while
// the camera's down-angle is >= 0.3665 rad.  That is the whole finding.
//
// OWTILT is the second number, and it is what lets the camera stay HIGH while
// still seeing a distance plane — which is what the FFIX-reimagine references
// actually are (refs 1/3: a sliver of sky, then a quarter-frame of layered hazy
// ridge; not low cameras).  The boom position still comes from OWPITCH, so the
// camera keeps its elevation over the canopy; the camera is then rotated UP by
// OWTILT about its own X, which moves the horizon down into frame and the player
// down with it.  Effective down-angle = OWPITCH - OWTILT; the player's height in
// frame is 0.5 + 0.5*tan(OWTILT)/tan(21 deg).
// SHIPPED: pitch 0.61 UNCHANGED (see the sweep — every reduction of it drove the boom
// into terrain, because this rig has no camera collision), tilt 0.22.
// ?owtilt=0 is the exact frame we shipped before this change.
let OWPITCH=0.61, OWTILT=0.22;
function owCamRead(q){
  if(q.has('owpitch')) OWPITCH=parseFloat(q.get('owpitch'));
  if(q.has('owtilt'))  OWTILT =parseFloat(q.get('owtilt'));
}
// ---- WHERE THE WORLD ENDS (playtest round 6) --------------------------------
// public/game/worldbounds.json, fetched once per page and applied per scene. A
// scene with no entry is unbounded and behaves exactly as it did before. The
// number is the region's own water line; the file carries the measurement and the
// reason, and walkStep() carries the rule. Fetched, not hardcoded, because the
// bound is MAP DATA — the same call as lightrigs.json, and it is committed for the
// same reason lightrigs.json had to be.
let WORLDBOUNDS=null, FLOORY=null;
function wbFloor(s){
  const e=WORLDBOUNDS&&WORLDBOUNDS.scenes&&WORLDBOUNDS.scenes[s];
  return e&&typeof e.floorY==='number' ? e.floorY : null;

fetch('game/worldbounds.json?v='+Date.now()).then(r=>r.ok?r.json():null).then(j=>{
  WORLDBOUNDS=j; FLOORY=wbFloor(SCENE);          // re-apply: the fetch loses the race with the first sceneParams()

sceneParams(Q0);
const W=1344,H=768;
// per-character sheet layout (cols,rows,dirs); extend as cast is added
const SHEETS={ vesper:{cols:6,rows:3,down:{row:0,n:4},up:{row:1,n:4},side:{row:2,n:6}} };
const CFG=SHEETS[CHAR]||SHEETS.vesper;
const SPRITE=!!Q.get('sprite');            // 3D model is default; ?sprite=1 for the old billboard

// (localStorage) > the default — which is VESPER-V2, the user's own model.
// finn/mara/maren/pip/lake are NPC-RECIPE builds (Walk_Loop, 0.46 u/s): in the picker for
// INSPECTION — as player models their walk would need ~10x to lock cadence (moon-skate).
const MODELS={ 'vesper-v2':'assets/characters/vesper/vesper-v2.glb', 'vesper-test':'assets/characters/vesper/anim_test.glb', 'rogue':'assets/characters3d/rogue.glb',
  'finn':'assets/characters/finn/finn-v1.glb', 'mara':'assets/characters/mara/mara-v1.glb',
  'maren':'assets/characters/maren/maren-v1.glb', 'pip':'assets/characters/pip/pip-v1.glb',
  'lake':'assets/characters/lake/lake-v1.glb' };
// SESSION-scoped, not localStorage (user bug 2026-08-01: previewing finn in the H
// picker permanently swapped the PLAYER body — a dev preview must not outlive the
// tab). Old localStorage key is cleared on load so stuck players self-heal.
const MODEL_KEY=(function(){ try{localStorage.removeItem('eb-model');}catch(e){}
  try{return sessionStorage.getItem('eb-model')||'vesper-v2';}catch(e){return 'vesper-v2';} })();
const MODEL_URL=Q.get('model')||MODELS[MODEL_KEY]||MODELS['vesper-v2'];
let MODEL_H=parseFloat(Q.get('ch'))||parseFloat(localStorage.getItem('eb_ch'))||1.45;  // live-tunable: [ ] keys or the M menu
let modelNatH=0, modelMinY=0;
function setCharH(h){MODEL_H=Math.round(Math.max(1.0,Math.min(2.2,h))*100)/100;localStorage.setItem('eb_ch',MODEL_H);
  if(model&&modelNatH){const k=MODEL_H/modelNatH;model.scale.setScalar(k);model.position.y=-modelMinY*k;}
  const el=document.getElementById('chval'); if(el)el.textContent=MODEL_H.toFixed(2);}
const el=document.getElementById('s'), hud=document.getElementById('h');
// live-refresh scenes (townwalk) ship meta.json with the export time — surface
// it in the HUD so a viewer always knows how fresh the geometry they see is
let BUNDLE_TS='', METASPAWN=null, METAYAW=null;
// ---- THE EPOCH -------------------------------------------------------------
// Every per-scene async load (meta, depth, cine art, zones, the GLB itself) is
// stamped with the epoch that started it. A transition bumps the epoch, so a
// response that arrives for a scene the player has already left is DROPPED and
// whatever it carries is disposed instead of being spliced into the live world.
// This is what replaces "the page died, so nothing can leak".
let EPOCH=0;
function loadMeta(ep){
  fetch(BASE+'meta.json?v='+Date.now()).then(r=>r.ok?r.json():null)
  .then(j=>{if(!j||ep!==EPOCH)return; if(j.exported)BUNDLE_TS=' · master@'+j.exported.slice(11);
    // live-preview scenes can pin their spawn (e.g. gate-branch spawns AT the gate,
    // not at the town center — the district under construction must be in view)
    // a region may also pin the initial follow-camera heading (ow-valley spawns at
    // the emberbrook-gate portal FACING DOWN THE ROAD; the default 45deg orbit
    // would start the player looking into the hillside behind the gate)
    if(j.camYaw!=null&&URLYAW==null){METAYAW=j.camYaw; if(window.ORBIT)window.ORBIT.yaw=j.camYaw;}
    if(j.spawn&&!URLSPAWN){METASPAWN=j.spawn; if(allMeshes.length){P.x=j.spawn[0];P.z=j.spawn[2];
      const f=walkFloors(P.x,P.z); P.y=f.length?f.reduce((a,b)=>Math.abs(a-j.spawn[1])<Math.abs(b-j.spawn[1])?a:b):j.spawn[1];

}
const R=new THREE.WebGLRenderer({antialias:true}); R.setSize(W,H,false);
// ===== COLOUR MANAGEMENT (three r185; r128 had none) =========================
// Both of these are r185 DEFAULTS and are written out anyway, because the whole
// point of the upgrade is that the pipeline's colour handling is now declared
// rather than inherited: every texture says which space its bytes are in, the
// renderer works in linear-sRGB, and the framebuffer is encoded to sRGB once, at
// the end. Under r128 none of that was stated — the raw bytes went down the pipe
// and the look was whatever fell out.
THREE.ColorManagement.enabled = true;
R.outputColorSpace = THREE.SRGBColorSpace;
el.appendChild(R.domElement);
// ===== THE TONE CURVE =======================================================
// (2026-08-02, character-lighting lane. ?tone=off|aces|agx to A/B it live.)
//
// THE PAGE SHIPPED NoToneMapping — a raw linear ramp — while every backdrop it
// draws was baked through Blender's AgX at "AgX - Medium High Contrast"
// (public/assets/scenes/*/cine.json defaults.view_transform / .look). So the
// PLATE has filmic shoulder, toe and contrast and the CHARACTER standing on it
// has none: her lit side clips flat white exactly where the plate rolls off, and
// her shadow side crushes to a single value. That is a large part of what reads
// as "the models have no lighting" — the light was wrong AND it was being shown
// through the wrong transform.
//
// TWO THINGS MUST NOT GO THROUGH IT, and both are the same rule: a tone curve
// belongs to SCENE-REFERRED light and nothing else.
//   1. The BACKDROP. three r128's background_frag ends with
//      `#include <tonemapping_fragment>`, so scene.background — an already-AgX'd,
//      already-display-referred PNG — would be graded a SECOND time and come back
//      milky. The background material is built lazily inside WebGLBackground's
//      closure and cannot be reached to set toneMapped=false, so the include is
//      taken out of ShaderLib.background here, BEFORE the first frame builds it.
//   2. The overworld's PAINTED CONSTANTS (sky dome, ridge silhouettes) — see
//      their toneMapped=false below. They are colours someone chose to appear
//      exactly as typed, not radiance.
//
// WHY AgX AND NOT ACESFilmic. Both were rendered and looked at
// (docs/qa/charlight/tone-*.png). ACES is the obvious candidate and it is wrong
// HERE for one specific reason: it lifts and warms mid-tones and pushes saturated
// colour toward the highlight, so Vesper's hair and coat came back hotter and
// more orange than any pixel of the Emberbrook night plate around her — the
// pasted-on look, arrived at from the other direction. AgX desaturates as it
// approaches white, which is the whole reason the plates were baked in it.
// AgX IS NATIVE NOW (three r185; it landed in r160). This page used to carry a
// hand-backport of r160's shader into the CustomToneMapping slot, with a
// hand-derived contrast/pivot pair approximating Blender's "AgX - Medium High
// Contrast" look. That whole block is GONE: THREE.AgXToneMapping is the same
// curve, maintained upstream, and the one thing the backport added — the extra
// log-space contrast push at pivot 0.606 — is now carried by the exposure knob
// instead of by a copy of somebody else's shader we would have to keep in sync.
// The two are not pixel-identical; the plates are slightly softer in the mids
// than the backport made them, which is the actual AgX shoulder rather than our
// approximation of Blender's grade on top of it.
THREE.ShaderLib.background.fragmentShader =
  THREE.ShaderLib.background.fragmentShader.replace('#include <tonemapping_fragment>', '');
// THE CURVE IS PER SCENE, AND THAT IS THE MEASURED ANSWER, NOT A COMPROMISE.
// A tone curve exists here to make the live character match a PLATE that was
// already graded; where there is no plate there is nothing to match. Rendered
// three ways and looked at (docs/qa/charlight/tone-ow-{off,aces,agx}.png), the
// overworld under either filmic curve loses most of its colour — the meadow
// greens go khaki, the river's cyan goes grey-teal, the cottage window glows go
// cream — because its palette is direct albedo under a 2.60 key that was solved
// in linear and RATIFIED by the user hours ago. So: AgX in the baked-plate towns,
// where it is a correction; NoToneMapping in ow-*, where it would be a re-grade
// of somebody else's finished work. The battle arena is not in this decision at
// all — battle_stage3d.js builds its OWN THREE.WebGLRenderer (and its own
// four-pass grade), so `R.toneMapping` never reaches it. Verified, not assumed:
// docs/qa/charlight/{before,after}-battle.png are the same picture.
// ?tone=off|aces|cineon|agx overrides EVERY scene, which is how the three
// overworld frames above were taken.
const TONEQ=Q.get('tone');
const TONE_MODES={off:THREE.NoToneMapping, aces:THREE.ACESFilmicToneMapping,
                  cineon:THREE.CineonToneMapping, agx:THREE.AgXToneMapping,
                  neutral:THREE.NeutralToneMapping};
const TONE_TOWN=(TONEQ&&TONE_MODES[TONEQ]!=null)?TONE_MODES[TONEQ]:THREE.AgXToneMapping;
const TONE_FORCED=(TONEQ&&TONE_MODES[TONEQ]!=null)?TONE_MODES[TONEQ]:null;

R.toneMappingExposure=+(Q.get('toneexp')||1.0);
let TONE_NOW=THREE.NoToneMapping;
function setTone(mode){
  if(TONE_FORCED!=null) mode=TONE_FORCED;
  if(mode===TONE_NOW) return mode;

  // count toneMapping among the reasons to rebuild a program (its
  // needsProgramChange looked at outputEncoding, lights, instancing, envMap, fog,
  // clipping planes and vertexAlphas and nothing else), so every already-compiled
  // material kept the OLD curve across a scene swap — walk from the overworld into
  // a town and the character still rendered ungraded inside a graded frame. This
  // page carried a full scene.traverse(needsUpdate=true) to work around it.
  // r185 stores parameters.toneMapping on the material and compares it in
  // setProgram (WebGLRenderer.js: `materialProperties.toneMapping !== toneMapping`),

  return mode;

const scene=new THREE.Scene();

let BGTEX=null;                                   // owned by this scene; disposed on swap

// ===== THE POST STACK =======================================================
// (2026-08-03, post-processing lane. ?postfx=off restores the direct path;
//  ?postfx=all is the DIAGNOSTIC that forces the composer onto a baked-plate town,
//  and the reason it exists is written below.)
//
// THE STACK IS PER SCENE FAMILY, and that is a measurement, not a preference.
//
//   REAL-TIME (ow-*, townwalk — anything RT): RenderPass -> GTAO -> bloom -> Output.
//     These scenes are honest geometry under a solved key with NO baked lighting of
//     any kind, so nothing in them was ever occluded by anything: a cottage sill, a
//     pavilion post and a fence stake all meet the ground on a hard albedo seam with
//     no darkening at the contact. Ground-truth ambient occlusion is the single
//     effect that changes that, and it is the one thing this game has never had.
//
//   BAKED-PLATE TOWNS (emb-*, del-*): NOTHING. The composer is not built and the
//     page renders exactly as it did. Two independent reasons, either sufficient:
//
//     1. THERE IS NO GEOMETRY TO OCCLUDE. The "world" in those scenes is a
//        full-screen quad showing a Cycles render; the only real meshes are the
//        character and the collision hulls, which are colorWrite:false. Screen-space
//        AO would be computed against depth.png's reconstruction of a picture that
//        ALREADY CARRIES CYCLES' OWN AO, and would darken every crease in the plate

//        material-level tone mapping whenever the destination is a non-XR render
//        target (WebGLPrograms.js: `if (material.toneMapped) if (currentRenderTarget

//        OutputPass is supposed to apply the curve at the end instead. But the plate
//        does not arrive through a material: it is scene.background, and this file
//        deliberately STRIPS `#include <tonemapping_fragment>` out of
//        ShaderLib.background (see THE TONE CURVE above) because a plate baked
//        through Blender's AgX must not be graded twice. Under a composer that
//        exemption is lost — OutputPass grades the whole buffer, plate included, and
//        the town comes back milky. `?postfx=all` reproduces it on demand and
//        docs/qa/postfx/rejected-* is the photograph. This is the same ruling the

//        scene-referred light, and a finished plate is not that.
//
//   THE BATTLE ARENA is not in this decision at all — battle_stage3d.js builds its

//
// AA COMES FROM MSAA, NOT FROM A PASS. `new WebGLRenderer({antialias:true})` only

// have silently thrown the game's antialiasing away and made silhouettes worse
// while claiming a win. The composer's own buffers are therefore allocated

const PFXQ=Q.get('postfx')||'';

  // default) is a crease-darkener for a product shot; at the overworld's 40 m boom
  // it is under a pixel and does nothing. 0.9 m is a doorstep, a post-foot and a
  // roof eave — the scale at which "this object sits ON something" is legible from
  // the follow camera.
  aoRadius: PFXNUM('ao_r',0.9),
  aoIntensity: PFXNUM('ao_i',0.9),
  aoScale: PFXNUM('ao_s',1.6),               // gamma on the AO term: contrast, not depth
  aoThickness: PFXNUM('ao_t',1.4),
  aoSamples: Math.round(PFXNUM('ao_n',16)),

  // exponential and anchored it on the player, and the next blind critic still said

  // left carry the same contrast and saturation." MEASURED, on the frames' own
  // geometry (scratchpad/r12, __depths + __t off PFXRIG's shipped uniforms):

  //        depth beyond the character   p90    max      t at the FAREST thing
  //   meadow                            34.2   50.4     0.50
  //   gate                              26.7   40.1     0.32
  //   vista                             35.8   49.6     -

  // NOTHING IN ANY OF THE FOUR FRAMES EVER GOT MORE THAN HALF THE CUE, because the
  // ramp was normalised over dFar-dNear = 149 m and the frames hold 40-60 m of
  // geometry. Five rounds swept the SHAPE of a curve whose SPAN was wrong; R11 fixed
  // linear-vs-exponential and left the span. The normalisation is the fourth thing
  // on this one effect to be tuned while disconnected, and the tell was always
  // available for the cost of one raycast: ASK THE FRAME HOW DEEP IT IS BEFORE
  // CALIBRATING A DEPTH CUE FOR IT.
  // dNear 6 -> 10 (the near field is genuinely untouched: the meadow's near canopy
  // sits at 11 m and takes t 0.06), dScale 60 -> 20, dFar 155 -> 60. Now: meadow
  // far slope 0.84, far hill 0.88, gate far ground 0.62, gorge far meadow 0.99.
  gradeNear: PFXNUM('grade_n',10),
  // dFar IS THE MEASURED SPAN OF THE FRAME, not a round number: from the 40 m boom
  // at the shipped pitch the visible ground runs about 30 m to 110 m radial, so a
  // 150 m far point spends the whole frame on the first half of the ramp and the
  // cue never arrives. 105 puts the far edge of the picture at the far end of it.
  // R5 (2026-08-04): 105 was measured against the frame BEFORE ORBIT.tilt, which
  // more than doubled the visible depth. The far edge of the picture is now well
  // past 105 m, so the whole back half of the frame sat clamped at t=1 with no
  // gradient left in it. 155 puts the ramp back across the picture as shipped.
  gradeFar: PFXNUM('grade_f',60),
  // lift is the "distance goes PALE" term, and paleness is exactly what the
  // mid-corridor frame was complained about for. Halved; the desat below carries
  // the recession instead, which costs chroma without costing black point.
  gradeLift: PFXNUM('grade_l',0.016),
  // R6 (2026-08-04) PULLS THE TINT BACK FROM 2.2. At 2.2 the near warm was
  // (1.121, 1.000, 0.846) applied to every pixel in the front half of the frame —
  // an 11% red gain against a 15% blue cut on grass, roof, path and shadow alike.
  // That is most of "everything is one garish amber". 1.45 leaves the golden hour
  // clearly warmer than neutral while the LIT WEIGHT below decides where it lands.
  // R10 (2026-08-04) BACKS IT OFF ~50% AGAIN, 1.45 -> 1.20, and the pairing is the
  // whole point. "The greens are gone — the meadow is yellow-orange, the dirt is
  // orange, the roofs are orange, the shadows are orange... it went past the point
  // where warmth reads as time of day and into the point where it reads as a
  // filter." R5 already tried the naive version of this and the frame got WORSE
  // (desaturating globally went milky and the amber was graded away). What is
  // different here is that the fill is now a genuinely different colour, so the
  // warmth that comes off the grade is not lost — it moves into the terminator.
  // Alone, this number is a regression; with THE LIGHT GETS A SECOND COLOUR it is
  // the second half of one change. Do not move one without the other.
  gradeTint: PFXNUM('grade_k',1.20),       // scales both tints away from neutral
  // THE LIT WINDOW for the warm push (R6): source luminance below litLo takes none
  // of it, above litHi takes all of it. The floor sits under the frame's shadow
  // band (measured L05 0.12-0.16 on the four landscape cameras) so a shadow keeps
  // the cool fill's own hue instead of being repainted amber by the post pass.
  gradeLitLo: PFXNUM('grade_ll',0.16),
  gradeLitHi: PFXNUM('grade_lh',0.46),
  // THE THIRD HALF OF AERIAL PERSPECTIVE, and the one we never had (R5). Measured
  // on the two daylight references with tools/../bands.py: their saturation RISES
  // toward the camera — FAR 0.30/0.35, MID 0.33/0.39, NEAR 0.48/0.49 — while ours
  // was FLAT and roughly double (gate FAR 0.63 MID 0.67 NEAR 0.75). A frame whose
  // 150 m band is as chromatic as its 3 m band has no distance in it whatever the
  // hue does. This mixes the far end toward its own luminance, scaled by the same
  // depth ramp: chroma removed, VALUE and local contrast untouched, which is the
  // difference between recession and the milky fog the same frame was rejected for.
  // R11. THE RAMP'S SHAPE (see THE RAMP WAS LINEAR in GRADE_SHADER): dNear drops
  // 28 -> 14 because the meadow camera's own subject sits at 18-25 m, and dScale is
  // the extinction length that makes one ramp serve a 60 m frame and a 230 m ridge.
  gradeScale: PFXNUM('grade_s',20),
  // The haze TARGET, as a colour and an amount. It is anchored to the ridges
  // (__owridge ring 1 is 0x8496a9) and set BELOW them — a haze paler than the thing
  // behind it is the R7 defect all over again.
  // R12 — AND IT WAS WRITTEN IN THE WRONG COLOUR SPACE, which is the house trap
  // (CLAUDE.md: SAY WHICH SPACE THE BYTES ARE IN). 0.395/0.455/0.560 are the sRGB
  // components of that ridge colour, and this pass runs BEFORE OutputPass, i.e. in
  // the LINEAR working space: fed straight in, the target landed on screen at about
  // (168,179,196) — a stop and a half up and most of its chroma gone — so "mix the
  // far band toward a low-chroma blue" was mixing it toward a pale near-neutral,
  // and the more haze you asked for the WHITER the distance got. That is the twelfth
  // critic's "B's upper-right meadow is a pale lavender-white wash so desaturated it
  // looks blown out rather than distant", and it was the haze, not the fill.
  // Converted: srgbToLinear(0.395,0.455,0.560) = 0.127/0.175/0.275. Measured on that
  // same slope, at the SAME haze amount: (181,191,199) sat .089 -> (154,164,174)
  // sat .119, which now sits beside the ridge band it is supposed to recede into
  // (130,149,170). ?grade_hc=r,g,b sweeps it, in LINEAR.
  gradeHaze: PFXNUM('grade_h',0.55),
  // 0.87 = the 13% off global chroma. The rest of the critic's 15-20% is in the
  // terrain's COLOR_0 where it belongs, because an albedo fix survives every camera.
  gradeSat: PFXNUM('grade_sat',0.87),
  // R13 — 0.38 -> 0.06, AND THE REFERENCES ARE WHY. R11 added this toe to buy back a
  // black point after the critic asked "is anything in the frame genuinely dark". The
  // references answer that question themselves and the answer is NO: measured over the
  // playfield of both FFIX overworld shots, **ZERO PERCENT of their pixels sit under
  // L 0.10**, and their L05 is 0.211 / 0.276. Ours was 0.084 / 0.043 with 6.4% / 14.2%
  // of the frame under 0.10. We were not short of darks; we had crushed them, and a
  // crushed shadow has no signal left to carry a hue — which is half of why the shadow
  // colour has now been guessed wrong twice (violet, then brown). The toe stays as a
  // knob because "far darks should lift, near darks should not" is still true.
  gradeToe: PFXNUM('grade_toe',0.06),
  // the yellow-selective chroma pull; see THE PULL IS YELLOW-SELECTIVE.
  // R12's yellow-selective pull. R13 CUTS IT TO A TOKEN and the reason is measured on
  // the references themselves, not chosen: their grass is MORE saturated in shade than
  // in light (HSV sat ratio shade/lit 2.41 on ref 1, 1.36 on ref 3), so a pull that
  // lands on every vegetation pixel in the frame is fighting the thing the refs do.
  // What is left is insurance against the chartreuse R12 was fixing. ?grade_gp= sweeps.
  gradeGreen: PFXNUM('grade_gp',0.06),
  // THE THREE PER-MATERIAL TERMS (R13). See the selectors in GRADE_SHADER.
  // wp — the terracotta/fired-clay pull. The roofs were the loudest thing in the
  // meadow frame (warm-family sat 0.534 over 44.8% of the pixels; the references run
  // 0.371-0.490 over 0.3-1.5%). tools/valley_build.py's ROOF albedo carries the other
  // half of this: an albedo fix survives every camera, a grade fix survives every asset.
  gradeWarm: PFXNUM('grade_wp',0.26),
  // cp — the river. "Opaque flat cyan... the most saturated thing in the frame and the
  // least believable material in either frame." The REAL fix is the water treatment in
  // the bundle (docs/plans/water-transparency.md); this is the part that lands on the
  // pixel whatever the material does, and it is deliberately small so it cannot be
  // mistaken for that work.
  gradeCyan: PFXNUM('grade_cp',0.20),
  // vb — and the vegetation gets its chroma BACK. This is the term that makes the set
  // per-material rather than just a second global pull: without it, cutting gp and
  // adding wp/cp is still a frame-wide walk-back with a different sign.
  gradeVeg: PFXNUM('grade_vb',0.18),
  // vh — the vegetation HUE, see "ALMOST NO HUE VARIATION" in GRADE_SHADER. Swept.
  gradeVegHue: PFXNUM('grade_vh',0.10),
  gradeDesat: PFXNUM('grade_d',0.40),
};
// THE AERIAL SPLIT (2026-08-03, overworld only, ?grade=0 to remove).
//
// THE FINDING THIS ANSWERS, from the overworld-art lane via the coordinator: our
// four ow-* cameras are fixed high and looking DOWN, so a shipped frame contains
// no horizon and no sky to tint — the usual "cool the far background" move has
// nothing to act on. Meanwhile the FFIX reference shots
// (public/assets/refs/reimagine_ff9_overworld_*.jpg) get their depth from exactly
// one thing: COOL BLUE-GREY DISTANCE AGAINST WARM NEAR GROUND. The r185 upgrade
// moved us the other way (their measurement: chroma 46.5 -> 42.0 on ow-closeup,
// 44.6 -> 38.7 on ow-corridor-turn, both frames warmer and more unified).
//
// WHY NOT MORE FOG. There already IS fog here — `scene.fog = Fog(0xd3e0e8, 34,
// 205)`, landed 2026-08-03 by the sky lane — and fog is a MIX TOWARD A COLOUR: it
// buys distance by taking contrast and saturation OUT of the far ground. Turning
// it up to get the reference's separation flattens the thing it is separating.
// This pass does the half fog cannot: a MULTIPLICATIVE warm/cool split by depth.
// Near ground is multiplied by a warm triple, far ground by a cool one, so the
// hue separates while the luminance and the local contrast stay where the art
// direction put them — that is chroma ADDED, not density removed.
//
// RADIAL, NOT PLANAR, and that is the whole reason it is a post pass instead of a
// second Fog. three's Fog runs on `-mvPosition.z`, distance along the camera axis,
// which under a 35 deg downward boom is very nearly the vertical screen axis: it
// makes the TOP of the frame far and the BOTTOM near, in a scene where the player
// is in the middle and the ground wraps around them. This reconstructs the view
// position from the depth buffer and uses `length(viewPos)`, so the cue radiates
// from the character in every direction, which is what a top-down frame needs.
//
// IT RIDES GTAO'S G-BUFFER. The AO pass already renders a normal+depth prepass
// every frame; this samples that depth texture rather than allocating one, which
// is why the whole effect costs one fullscreen quad and zero extra memory. It is
// therefore skipped when AO is off (?ao_i=0), which is stated rather than hidden.
const GRADE_SHADER={
  uniforms:{ tDiffuse:{value:null}, tDepth:{value:null}, projInv:{value:new THREE.Matrix4()},
             dNear:{value:30}, dFar:{value:150}, amt:{value:1}, lift:{value:0.03},
             desat:{value:0.0}, litLo:{value:0.0}, litHi:{value:1.0},
             haze:{value:0.0}, sat:{value:1.0}, dScale:{value:52.0}, dRef:{value:0.0}, toe:{value:0.0},
             gp:{value:0.0}, wp:{value:0.0}, cp:{value:0.0}, vb:{value:0.0}, vh:{value:0.0},
             hazeCol:{value:new THREE.Vector3(0.127,0.175,0.275)},
             warmCol:{value:new THREE.Vector3(1.055,1.000,0.930)},
             coolCol:{value:new THREE.Vector3(0.900,0.972,1.105)} },
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:[
    'varying vec2 vUv; uniform sampler2D tDiffuse, tDepth; uniform mat4 projInv;',
    'uniform float dNear,dFar,amt,lift,desat,litLo,litHi,haze,sat,dScale,dRef,toe,gp,wp,cp,vb,vh;',
    'uniform vec3 warmCol,coolCol,hazeCol;',
    'void main(){',
    '  vec4 c=texture2D(tDiffuse,vUv);',
    '  float d=texture2D(tDepth,vUv).x;',
    // depth 1.0 is "nothing was drawn here" — the sky dome is a BackSide sphere and
    // the G-buffer's override material is FrontSide, so it never reaches this
    // buffer. Leaving those pixels alone is what keeps the painted sky painted.
    '  if(d>=0.999999){ gl_FragColor=c; return; }',
    '  vec4 v=projInv*vec4(vUv*2.0-1.0, d*2.0-1.0, 1.0); v/=v.w;',
    // R11 — THE RAMP WAS LINEAR OVER 28..155 m AND THEREFORE NEVER RAN IN THE TWO
    // FRAMES THAT NEEDED IT. The meadow and gate cameras see 10-60 m of world; at
    // 50 m the old smoothstepped t was 0.079, so the tan slope and the far houses
    // took ~8% of a cue built for a 155 m corridor and did not recede AT ALL. Five
    // rounds recorded "our near-band saturation is flat with depth in the two close
    // cameras" and read it as "those frames have no distance for the grade to work
    // on"; the frames have 60 m of distance and the RAMP had none in that range.
    // An exponential extinction is what atmosphere actually is and it serves both
    // spans from one number: with dNear 14 / dScale 52 it reaches 0.19 at 25 m,
    // 0.50 at 50 m, 0.81 at 100 m and 0.94 at 155 m. `dFar` is kept as the clamp
    // point so ?grade_f= still means what it meant.
    '  float dist=length(v.xyz)-dRef;',
    '  float tMax=1.0-exp(-max(1.0,dFar-dNear)/max(1.0,dScale));',
    '  float t=clamp((1.0-exp(-max(0.0,dist-dNear)/max(1.0,dScale)))/tMax, 0.0, 1.0);',
    // THE WARM HALF IS GRADED INTO THE LIGHT, NOT ACROSS THE FRAME (R6, 2026-08-04).
    // R5 multiplied EVERY near pixel by warmCol, which is a global tint by definition —
    // the exact thing the whole lane exists to undo, arriving through the grade instead
    // of through the ambient. A blind critic ranked the result last of four and said of
    // it "this is a global tint, not a light", while the lit:shadow ratio said 3.29:1.
    // Both are true: the KEY has a direction and the GRADE did not.
    // So the warm push is now weighted by the pixel's own luminance — full on a lit
    // surface, nothing in a shadow — and the COOL far push is not, because haze is
    // atmospheric and does land on everything. That single line is the difference
    // between "the light is warm" and "the picture is orange".
    '  float srcL=dot(c.rgb, vec3(0.2126,0.7152,0.0722));',
    '  float litK=smoothstep(litLo,litHi,srcL);',
    '  vec3 tint=mix(mix(vec3(1.0),warmCol,litK),coolCol,t);',
    '  vec3 o=mix(c.rgb, c.rgb*tint, amt);',
    // DISTANCE LOSES CHROMA (R5). Toward the pixel's OWN luminance, not toward a
    // fog colour: a mix to grey keeps the value the key put there, so the far
    // band recedes without the frame going milky and without the black point
    // moving. Scaled by the same t, so nothing at the player's feet is touched.
    '  float lum=dot(o, vec3(0.2126,0.7152,0.0722));',
    '  o=mix(o, vec3(lum), clamp(desat*t*amt,0.0,1.0));',
    // the far lift is aerial perspective's other half: distance does not only go
    // cool, it goes PALE. Scaled by t so nothing near the player moves.
    '  o+=coolCol*lift*t;',
    // R11 — THE HUE TARGET. The tenth critic named this the single largest craft
    // gap in the whole project: "value and chroma compression across depth. Near
    // and far sit at the same contrast and the same saturation. C and D both push
    // distance toward low-contrast BLUE and hold their darkest darks in the
    // FOREGROUND." A multiply (coolCol) can only tint what is already there and a
    // desat can only remove chroma; neither COMPRESSES CONTRAST, because both are
    // per-pixel scalings and contrast is a relation between pixels. A mix toward a
    // fixed low-chroma blue at a fixed mid value does all three at once: hue
    // targeted, chroma down, and the far band's blacks and whites both pulled to
    // the same place while the near band keeps the frame's real black point.
    // THIS IS THE MOVE R5 WAS REFUSED FOR, and the difference is the ramp under it:
    // R5 mixed the WHOLE FRAME toward a fog colour and went milky. This rides `t`,
    // which is now exponential and ~0 inside 20 m, so the foreground is untouched
    // by construction. `?grade_h=0` removes it if a later round disagrees.
    '  o=mix(o, hazeCol, clamp(haze*t*amt,0.0,1.0));',
    // R11 — THE GLOBAL CHROMA PULL, the critic's item 3 and the one it said to do
    // BEFORE judging anything else ("A looks over-corrected on warmth and
    // saturation... judge the next pass on whether the greens have come back off
    // yellow"). The terrain's own COLOR_0 carries most of this (tools/valley_land.py
    // surface(), grass_gain 1.34 -> 1.08 and the grass b:g multiplier 0.61 -> 0.81);
    // this is the part that lands on the ROOFS, the walls and the canopy, which have
    // no COLOR_0 lever of their own. It is deliberately small — R5 proved that
    // reaching the references' saturation NUMBER globally costs the golden hour.
    '  float oL=dot(o, vec3(0.2126,0.7152,0.0722));',
    '  o=mix(vec3(oL), o, sat);',
    // R12 — THE PULL IS YELLOW-SELECTIVE, and it is here because the albedo could
    // not do it. The twelfth critic's item 2: "pull green saturation down a further
    // 25-30% in A", called cheap and "a light and a colour setting". Three builds
    // spent on tools/valley_land.py's grass multiplier moved the meadow 1/255 each
    // time, and the live-attribute test says why: x2.818 on that ground's own
    // COLOR_0 blue buys 13% of the screen's blue. So it is done per-pixel, after
    // everything, where the number lands.
    // NOT A GREEN TEST — A YELLOW ONE. Our "greens" have RED as their max channel
    // under a (1.0,0.70,0.42) key: lit meadow is (180,169,108), i.e. r ~ g >> b.
    // A `g > max(r,b)` selector scores that at ZERO and would desaturate nothing.
    // The chartreuse signature is BLUE AS THE MINIMUM with r and g together, so the
    // selector is (min(r,g) - b) / max: meadow grass 0.53, canopy 0.5, and the
    // things that must NOT move score low — the orange roofs 0.18, the dry slope
    // 0.10, the character's teal dress 0. `?grade_gp=0` removes it.
    // R13 — AND THE PULL HAD TO BECOME PER-MATERIAL, because R12's was global and a
    // global one cannot do this job. The thirteenth critic: "A is over-corrected grey
    // on the greens. The grass is a dull uniform olive with almost no hue variation,
    // while the roofs stay a strong terracotta and the river stays a strong cyan —
    // that is the signature of a GLOBAL saturation walk-back applied where a
    // PER-MATERIAL one was needed. It killed the vegetation and left the two hero hues
    // untouched, so the frame is TWO LOUD COLOURS ON A DEAD FIELD."
    //
    // MEASURED, and the number is the whole argument (scratchpad/r13, a hue-family
    // census of our plates against the two FFIX references' own pixels):
    //
    //                        share of frame   HSV saturation
    //   ref 1 / ref 3  warm 10-45 deg    0.3% / 1.5%     0.490 / 0.371
    //   r12 meadow     warm 10-45 deg   44.8%            0.534
    //   ref 1 / ref 3  green 60-160    61.1% / 43.9%     0.418 / 0.484
    //   r12 meadow     green 60-160     17.0%            0.397
    //
    // Nearly half the meadow is warm-hue pixels at a saturation ABOVE either
    // reference's terracotta, while the greens sit under both. That is the critic's
    // sentence as arithmetic, and no single `sat` scalar can move one without the
    // other — it is one multiply on every pixel in the frame.
    //
    // THREE SELECTORS, each a channel-order test, so a material is picked out by what
    // it IS rather than by where it is. They cost three max/min and no texture reads.
    // Scored on the shipped r12 frames' own probe boxes:
    //   yel (min(r,g)-b)  vegetation   meadow grass 0.53  canopy 0.50  roof 0.18  road 0.10
    //   wrm (r-max(g,b))  fired clay   roof 0.32  road 0.20  grass 0.00 (g>=r under our key)
    //   cyn (min(g,b)-r)  the river    river 0.41  hazed far band 0.06  shaded grass 0.00
    // SHADED GRASS SCORES ZERO ON `cyn` AND THAT IS LOAD-BEARING: after the fill fix
    // above, shade swings blue-green (hue 87-103), and a naive "cool pixels" selector
    // would desaturate every shadow in the frame — undoing the round's other half.
    // b is still BELOW r in shaded grass, which is what keeps the two apart.
    '  float pMx=max(o.r,max(o.g,o.b));',
    '  float yel=clamp((min(o.r,o.g)-o.b)/max(1e-4,pMx), 0.0, 1.0);',
    '  float wrm=clamp((o.r-max(o.g,o.b))/max(1e-4,pMx), 0.0, 1.0);',
    '  float cyn=clamp((min(o.g,o.b)-o.r)/max(1e-4,pMx), 0.0, 1.0);',
    '  float kSat = 1.0 - gp*smoothstep(0.12,0.45,yel)',
    '                   - wp*smoothstep(0.14,0.34,wrm)',
    '                   - cp*smoothstep(0.16,0.40,cyn)',
    '                   + vb*smoothstep(0.28,0.55,yel);',
    '  o=mix(vec3(oL), o, max(0.0,kSat));',
    // R13 — AND "ALMOST NO HUE VARIATION" TURNED OUT NOT TO BE ABOUT VARIATION. The
    // critic's word was variation; the statistic says our vegetation had as much spread
    // as the references all along and the CENTRE was in the wrong place. Measured over
    // the green family (hue 55-160, sat > 0.15):
    //
    //                     hue mean   hue SD   hue IQR   sat mean
    //   ref 1              94.3       19.8     14.6      0.417
    //   ref 3              85.6       16.4     11.5      0.476
    //   r12 meadow         74.2       18.2     14.0      0.387
    //
    // Our spread was already inside theirs. Our vegetation simply sits 11-20 deg
    // YELLOWER than both, which is what "dull uniform olive" actually is — an olive is
    // a green whose hue is wrong, not a green with no variance. IF WE HAD READ THE WORD
    // AND NOT THE PIXELS we would have spent the round adding noise to a field that
    // already had it. (Same shape as the "flat far hillside" item: the critic names a
    // symptom, the instrument names the property.)
    // A green-channel gain on the same vegetation selector is what moves the centre —
    // in the green sector hue = 60*(2+(b-r)/(g-b)), so widening g-b is the only term
    // that walks 73 deg toward 90 (raising r walks it the WRONG WAY, which is worth
    // stating because it is the intuitive move). Luminance is renormalised after, so
    // this is a hue rotation and not a brightness push. ?grade_vh=0 removes it.
    //
    // AND THE FIRST MEASUREMENT OF THIS KNOB SAID IT DID NOTHING, WHICH WAS THE
    // INSTRUMENT'S FAULT. Swept 0 / 0.10 / 0.20, the green family's mean hue read
    // 77.3 / 76.8 / 77.3 — flat, and by this repo's own rule ("a knob swept without
    // moving the thing it names is a WIRING problem") that is four words from being
    // filed as a fifth disconnected knob. It is not. THE SELECTOR'S OWN BOUNDARY MOVES
    // WITH THE TREATMENT: the family is "hue 55-160 and sat > 0.15", the gain pulls
    // marginal pixels ACROSS the 55 deg edge (share 22.6% -> 28.4%), and those arrive
    // at the bottom of the range and hold the mean down. Re-measured on a FIXED PIXEL
    // SET (the vh=0 selection, applied to all three plates) the rotation is plainly
    // there: meadow 77.3 -> 79.6 -> 81.6, gorge 88.1 -> 89.9 -> 91.4, toward the
    // references' 85.6 / 94.3. WHEN A TREATMENT CHANGES THE CLASSIFIER, MEASURE ON THE
    // PIXELS AND NOT ON THE CLASS. 0.20 is measured and REFUSED by eye — the canopy
    // goes acid lime — which is the whole reason the plates get opened.
    '  if(vh>0.0){ vec3 og=o; og.g*=1.0+vh*smoothstep(0.28,0.55,yel);',
    '    float l0=dot(o,vec3(0.2126,0.7152,0.0722)), l1=dot(og,vec3(0.2126,0.7152,0.0722));',
    '    o=og*(l1>1e-5 ? l0/l1 : 1.0); }',
    // R11 — THE FOREGROUND TOE, and it exists because the first version of this pass
    // FAILED THE CRITIC'S OWN SECOND TEST while passing its first. Measured over the
    // whole frame, r10 -> r11a: saturation 0.545 -> 0.402 and the green b:g 0.634 ->
    // 0.771 (both asks, both met), but L05 went 0.127 -> 0.148 and the share of pixels
    // under L 0.10 went 3.47% -> 2.31%. THE FRAME HAD GOT LIGHTER IN ITS DARKS, which
    // is the exact opposite of "is anything in the frame genuinely dark".
    // Two of this round's own changes did it and both are wanted: a raised sky fill
    // (that is what puts texture back in shade) and a haze that mixes the far band
    // toward a mid value. The second one is not a defect at all — "C and D hold their
    // darkest darks in the FOREGROUND" means far darks SHOULD lift. So the black point
    // is bought back where the reference keeps it: a toe weighted by (1-t), biting

// map files): which edges leave this scene, where their triggers are, what they

// gate matters in a town that stacks tiers: without it a quay door would trigger
// through the street above it.

// a BAND: an oriented rectangle spanning the whole walk corridor, because on an 11 m
// harbour deck a 1.7 m trigger sphere is a thing you walk AROUND, and a boundary you
// can walk around is a camera that never changes. e.band = {n:[nx,nz] (the crossing

      // same room: swap under the veil, so a change of protagonist reads as a CUT
      // and never as one character morphing into another in open frame.
      if(key===BODY) return Promise.resolve({body:BODY, scene:SCENE, noop:true});
      return sgFade(1,ms).then(()=>loadBody(key))
        .then(()=>sgFade(0,ms)).then(()=>({body:BODY, scene:SCENE}))
        .catch(err=>{ sgFade(0,ms); return {error:String(err)}; });
    }
    if(!(SG&&SG.nodes&&SG.nodes[dest])) return Promise.resolve({error:'no scenegraph node '+dest});
    if(!Array.isArray(o.spawn)||o.spawn.length!==3) return Promise.resolve({error:'pov across scenes needs a spawn [x,y,z]'});
    const e={id:'pov:'+key+'@'+dest, from:SCENE, to:dest, kind:'pov', of:null,
             at:[P.x,P.y,P.z], r:sgDef('doorRadius',1.8), spawn:o.spawn,
             spawnYaw:(o.yaw==null?null:o.yaw), cam:(o.cam?{key:o.cam}:null),
             label:'', key:sgDef('key','e')};
    const t0=performance.now(), from=SCENE, r=transitionTo(e);
    if(!r) return Promise.resolve({error:'busy'});
    // The body loads WHILE the scene does, both under the same veil.
    const bodyP=(key===BODY)?Promise.resolve(null):loadBody(key).catch(err=>{ console.error('[pov] body load failed',err); return null; });
    return bodyP.then(()=>new Promise(res=>{ let n=0;
      const w=()=>{ if(!SGbusy||++n>1200) return res({from, to:SCENE, body:BODY,
        ms:Math.round(performance.now()-t0), timedOut:SGbusy});
        setTimeout(w,25); };
      setTimeout(w,25); }));
  },
  // ---- the in-place swap's own test surface ---------------------------------
  scene(){ return SCENE; },
  // Allocation-free "is a transition in flight". SIM.cine() and SIM.transitions()
  // both carry `busy`, but both build an object, and this one is read on EVERY
  // physics tick by the story director — a beat must never open inside the window
  // between the veil going up and the new scene being playable.
  busy(){ return SGbusy; },
  // renderer.info is the ONLY honest answer to "did the swap leak". A count that
  // does not come back to where it started after a round trip means something this
  // scene uploaded was dropped without being disposed, and three.js cannot know.
  gpu(){ const m=R.info.memory, p=R.info.programs;
    return {geometries:m.geometries, textures:m.textures, programs:p?p.length:null,
            meshes:allMeshes.length, collide:collide.length, walk:walkRef.length,
            cineArt:CINEART.size, epoch:EPOCH, sceneMats:SCENEMATS.size}; },
  // Collision-BVH accounting for the loaded bundle. `fail` MUST be 0: a mesh whose
  // BVH failed to build is still collidable (three.js raycast) but nothing on screen
  // says so. `copies` counts the walk/collision geometries that had to be given a
  // private index because glTF shared one — see the build site.
  bvh(){ return {...BVHSTATS}; },
  transitions(){ return {log:TRANSLOG.slice(-40), n:TRANSLOG.length,
                         busy:SGbusy, reloadPath:RELOAD, scene:SCENE, epoch:EPOCH}; },
  // Take the edge that leads to `to` (optionally the one whose id contains `via`)
  // and resolve when the transition has fully settled. This is SIM.go() with a
  // promise: a scripted gauntlet cannot poll SGbusy without racing the fade.
  door(to,via){
    // sgLive: a scripted gauntlet must not be able to walk through a sealed gate
    // the player cannot see. The end-to-end proof asserts the flag flips the edge
    // ON, and that assertion is worthless if this could take it either way.
    // sgDenied for the same reason from the other side: a harness that walks out
    // through a door the player is refused is a harness measuring a different game.
    const i=SGE.findIndex(e=>e.to===to&&e.from===SCENE&&sgLive(e)&&!sgDenied(e)&&(!via||String(e.id).indexOf(via)>=0));
    if(i<0) return Promise.resolve({error:'no edge to '+to+' from '+SCENE,
                                    have:SGE.filter(e=>e.to!==SCENE).map(e=>e.id)});
    const t0=performance.now(), from=SCENE, e=SGE[i];
    const r=transitionTo(e);
    if(!r) return Promise.resolve({error:'busy'});
    return new Promise(res=>{ let n=0;
      const w=()=>{ if(!SGbusy||++n>1200) return res({from, to:SCENE, id:e.id,
        ms:Math.round(performance.now()-t0), url:r.url, timedOut:SGbusy});
        setTimeout(w,25); };
      setTimeout(w,25); });
  },
});
// ---- BOOT ------------------------------------------------------------------
// The first scene load is the SAME call every subsequent door makes. That is the
// property that keeps the in-place path honest: there is no "first time" branch to
// rot, and a defect in the swap shows up on a plain page load too.
let TRANSLOG=[];
sceneLoad().then(r=>{ if(r) TRANSLOG.push({scene:r.scene, kind:'boot', ms:Math.round(performance.now())}); });
</script>
