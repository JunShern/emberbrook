<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberbrook Festival Props — review gallery</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1c1815; color: #f0e6d8;
         font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  header { padding: 24px 28px 8px; }
  h1 { margin: 0 0 4px; font-size: 22px; color: #ffb877; }
  .sub { color: #b7a892; font-size: 13px; }
  .sheet { max-width: 520px; width: 100%; display: block; margin: 16px 28px;
           border: 1px solid #3a332c; border-radius: 8px;
           background: #d8d8d8; }
  .grid { display: grid; gap: 18px; padding: 12px 28px 48px;
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background: #262019; border: 1px solid #3a332c; border-radius: 10px;
          overflow: hidden; display: flex; flex-direction: column; }
  .thumb { background:
      repeating-conic-gradient(#3a342d 0% 25%, #2c2721 0% 50%) 50% / 22px 22px;
      display: flex; align-items: center; justify-content: center;
      min-height: 210px; padding: 10px; }
  .thumb img { max-width: 100%; max-height: 240px; image-rendering: auto;
               filter: drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  .meta { padding: 12px 14px 14px; }
  .name { font-size: 17px; font-weight: 650; color: #ffcf9a; margin-bottom: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  td { padding: 2px 0; vertical-align: top; }
  td.k { color: #9c8d78; padding-right: 10px; white-space: nowrap; }
  td.v { color: #ece0cf; font-variant-numeric: tabular-nums; }
  .verdict { display: inline-block; padding: 1px 8px; border-radius: 6px;
             font-size: 11.5px; font-weight: 700; letter-spacing: .3px; }
  .PASS { background: #1f4023; color: #8ff0a0; }
  .AUTOFIT { background: #4a3d16; color: #ffd873; }
  .REDECLARE { background: #4a2416; color: #ff9d73; }
  .conf { font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Emberbrook Festival Square — prop sheet review</h1>
  <div class="sub">9 painted-isometric outdoor festival props, blocks9 registration-mark convention.
  Raw generated sheet below; each sliced sprite with measured metrics + base-containment verdict.
  Checkerboard shows sprite transparency.</div>
</header>
<img class="sheet" src="assets/iso/festival/sheet.png" alt="raw generated sheet">
<div class="grid" id="grid"></div>
<script>
const ORDER = ['brazier','applecrate','sign','haybale','firepit','logpile','pumpkincart','stall2','bigtree'];
fetch('assets/iso/festival/festival-metrics.json').then(r => r.json()).then(m => {
  const g = document.getElementById('grid');
  for (const name of ORDER) {
    const r = m[name] || {};
    const bc = r.baseContainment || {};
    const verdict = bc.verdict || '—';
    const extra = verdict === 'AUTOFIT' ? ' &times;' + r.renderFitScale
      : verdict === 'REDECLARE' ? ' &rarr; ' + JSON.stringify(r.declared) : '';
    const conf = r.confidence ?? 0;
    const row = (k, v) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`;
    g.insertAdjacentHTML('beforeend', `
      <div class="card">
        <div class="thumb"><img src="assets/iso/festival/${name}.png" alt="${name}"></div>
        <div class="meta">
          <div class="name">${name}</div>
          <table>
            ${row('declared', JSON.stringify(r.declared))}
            ${row('measured', JSON.stringify(r.measured))}
            ${row('cellPx', r.cellPx + ' <span style="color:#9c8d78">(' + (r.cellPxPerAxis||[]).join(' / ') + ')</span>')}
            ${row('anchorSprite', JSON.stringify(r.anchorSprite))}
            ${row('confidence', '<span class="conf" style="color:' + (conf>=0.9?'#8ff0a0':conf>=0.6?'#ffd873':'#ff9d73') + '">' + conf + '</span>')}
            ${row('base', (bc.measuredBase||[]).join(' &times; ') + ' cells')}
            ${row('verdict', '<span class="verdict ' + verdict + '">' + verdict + extra + '</span>')}
          </table>
        </div>
      </div>`);
  }
});
</script>
</body>
</html>
